project:
  type: book
  output-dir: _book

book:
  title: "SQL for Data Science"
  subtitle: "Querying, Designing, and Deploying Databases"
  reader-mode: true
  author: "Pete Benbow"
  cover-image: cover.png
  favicon: cover.png
  site-url: https://sql4ds.com/
  repo-url: https://github.com/pebenbow/sql4ds
  repo-branch: main
  repo-actions: [issue]

  page-footer:
    left: |
      _SQL for Data Science_ was written by Pete Benbow
    right: |
      This book was written with <a href="https://quarto.org/">Quarto</a>.
  chapters:
    - index.qmd

    - part: intro.qmd
      chapters:
        - why-learn-sql.qmd
        - setup.qmd
        - database-organization.qmd

    - part: query.qmd
      chapters:
        - select-statements.qmd
        - data-types.qmd
        - aggregating.qmd
        - joins.qmd
        - set-operations.qmd

    - part: analyze.qmd
      chapters:
        - conditional.qmd
        - subqueries.qmd
        - window-functions.qmd
        - r-database.qmd
        - python-database.qmd

    - part: design.qmd
      chapters:
        - create-table.qmd
        - keys-and-integrity.qmd
        - er-diagrams.qmd
        - normal-forms.qmd
        - data-manipulation.qmd
        - building-schema.qmd
        - views.qmd
        - programmability.qmd
        - security.qmd
        - indexes.qmd

    - part: load.qmd
      chapters:
        - extracting-data.qmd
        - transforming-with-polars.qmd
        - loading-with-sqlalchemy.qmd
        - etl-pipeline.qmd

    - part: deploy.qmd
      chapters:
        - supabase-setup.qmd
        - supabase-vscode.qmd
        - database-migrations.qmd

    - part: labs.qmd
      chapters:
        - sqli.qmd

    - references.qmd

filters:
  - quarto-dbml
  - at: pre-quarto
    path: filters/skip-code-window-for-output.lua
  - at: pre-quarto
    path: code-window
  - at: post-quarto
    path: filters/collapse-sql-output.lua

dbml:
  theme: light
  notation: crowsfoot
  routing: smooth

bibliography: references.bib

announcement:
  icon: exclamation-circle-fill
  dismissable: false
  content: "This site is in DRAFT form -- course content is subject to change"
  type: warning
  position: below-navbar

format:
  html:
    lightbox: true
    code-overflow: wrap
    code-block-bg: false
    df-print: paged
    # code-block-border-left: "#0165fc"
    author-meta: "Pete Benbow"
    callout-appearance: simple
    link-external-newwindow: true
    theme: [cosmo, custom-theme.scss]
    css: custom.css
    include-before-body: _devbanner.html
    syntax-definitions:
      - _extensions/quarto-dbml/dbml.xml
