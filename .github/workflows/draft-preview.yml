name: Draft Preview

# Renders the book from the `draft` branch and publishes it to a Netlify
# site that is entirely separate from sql4ds.com (production is deployed
# only from `main` via publish.yml, which just uploads the already-built
# _book/ committed there -- this workflow does a full fresh `quarto render`
# in CI instead and never touches that committed _book/ or the main branch).

on:
  push:
    branches: ["draft"]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    # `container:` puts this job on the same Docker network as the
    # `postgres` service below, so the book's hardcoded `host = "localhost"`
    # connections actually resolve to it. Matches the pattern already used
    # by the dat153/site workflow for the same reason.
    container:
      image: rocker/verse:latest

    services:
      postgres:
        image: pebenbow/open-sql-docker:latest
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Mirrors dat153-integration/render-env/Containerfile, which was
      # already built and vetted locally for this exact purpose (verifying
      # sql4ds chapters against open-sql-docker) -- transcribed here as
      # inline steps rather than publishing that image to a registry.
      - name: Install Quarto
        run: |
          curl -fsSL -o /tmp/quarto.deb \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.38/quarto-1.9.38-linux-amd64.deb"
          apt-get update
          apt-get install -y /tmp/quarto.deb
          rm /tmp/quarto.deb
          rm -rf /var/lib/apt/lists/*

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('DBI', 'RPostgres', 'reticulate'), repos = 'https://cloud.r-project.org')"

      - name: Install Python and packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          rm -rf /var/lib/apt/lists/*
          pip3 install --no-cache-dir --break-system-packages \
            jupyter \
            sqlalchemy \
            psycopg2-binary \
            polars \
            pandas \
            plotnine \
            seaborn \
            matplotlib \
            pyarrow

      - name: Render book
        env:
          # reticulate defaults to auto-provisioning its own Python via uv;
          # pin it to the interpreter the packages above were installed into.
          RETICULATE_PYTHON: /usr/bin/python3
          # NOTE: every chapter hardcodes host = "localhost" directly in its
          # dbConnect() call rather than reading a PGHOST env var, so there is
          # nothing to override here. "localhost" resolves to the `postgres`
          # service above only because this job runs inside `container:` --
          # GitHub Actions attaches service containers to that container's
          # own network and makes them reachable as localhost automatically.
          # A bare `runs-on` job without `container:` would need `ports:` on
          # the service plus a `localhost:<mapped-port>` connection instead.
        run: quarto render

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "_book"
          production-deploy: true
          deploy-message: "Draft preview - ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
