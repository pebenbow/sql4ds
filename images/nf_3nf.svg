<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Third normal form: no transitive dependencies</title>
<desc id="desc">In the 2NF orders table, order_id determines email and email determines customer, so customer depends on the key only through email, a transitive dependency. Alice's name and email repeat on orders 1 and 3. Moving customer and email to a customers table with a new customer_id key leaves orders with order_id, customer_id, and order_date. Each customer is now stored once. order_items is unchanged.</desc>
