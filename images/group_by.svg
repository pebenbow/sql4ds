<text x="44" y="586" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT carrier, COUNT(*) AS n, AVG(dep_delay) AS avg_delay</text>
<text x="44" y="604" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM flights</text>
<text x="44" y="622" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">GROUP BY carrier;</text>
