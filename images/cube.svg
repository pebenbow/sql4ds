<text x="520" y="486" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">GROUPING(birth_country) returns 1 on rows where that column was summed over.</text>
<rect x="30" y="514" width="560" height="138" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="44" y="536" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT birth_country, primary_genre, COUNT(*) AS actors</text>
<text x="44" y="554" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM actors</text>
<text x="44" y="572" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">WHERE birth_country IN ('UK', 'USA')</text>
<text x="44" y="590" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">  AND primary_genre IN ('Drama', 'Action', 'Comedy')</text>
<text x="44" y="608" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">GROUP BY CUBE (birth_country, primary_genre)</text>
<text x="44" y="626" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">ORDER BY birth_country NULLS LAST, primary_genre NULLS LAST;</text>
</svg>
