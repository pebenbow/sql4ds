<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 674" width="1695" height="1011" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">CUBE: subtotals for every combination of the grouping columns</title>
<desc id="desc">Actors born in the UK or USA with a primary genre of Action, Comedy, or Drama, counted by country and genre: UK 3, 3, 23 and USA 8, 14, 68. GROUP BY CUBE adds a subtotal for each country (UK 29, USA 90), a subtotal for each genre (Action 11, Comedy 17, Drama 91), and a grand total of 119. In the result, a NULL in a grouping column marks the column that was summed over. 12 rows in all.</desc>
