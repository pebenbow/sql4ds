<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">CUBE: subtotals for every combination of the grouping columns</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">CUBE (a, b) groups by (a, b), (a), (b), and ( ). Each extra grouping set fills in one margin of the grid.</text>
