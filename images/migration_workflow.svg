<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">One set of migration files, replayed on every database</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Each database remembers which files it has run. supabase db push runs only the ones it is missing, in timestamp order.</text>
