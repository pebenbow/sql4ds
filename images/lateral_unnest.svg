<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">CROSS JOIN LATERAL unnest(): one row per list item</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">The function runs once per order, turning that order's list into rows. Functions in FROM are lateral automatically.</text>
