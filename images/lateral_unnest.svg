<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" width="1500" height="1068" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">CROSS JOIN LATERAL unnest(): one row per list item</title>
<desc id="desc">Each row of order_lists gets its own run of unnest(string_to_array(products, ', ')). Order 1's 'Laptop, Mouse' becomes the array {Laptop,Mouse} and then 2 rows; order 2 gives 1 row, Keyboard; order 3 gives Monitor and Keyboard; order 4, Carla Diaz, has NULL products, so unnest returns 0 rows. The result has 5 rows, each product paired with its order's order_id and customer. Carla's order drops out; LEFT JOIN LATERAL ... ON true would keep it with a NULL product.</desc>
