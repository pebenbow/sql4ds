<text x="44" y="610" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT o.order_id, o.customer, product</text>
<text x="44" y="628" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM order_lists o</text>
<text x="44" y="646" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">CROSS JOIN LATERAL</text>
<text x="44" y="664" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">    unnest(string_to_array(o.products, ', ')) AS product;</text>
