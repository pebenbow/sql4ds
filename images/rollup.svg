<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 596" width="1695" height="894" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">ROLLUP: subtotals along a hierarchy, then a grand total</title>
<desc id="desc">Actors born in the UK or USA with a primary genre of Action, Comedy, or Drama, counted by country and genre: UK 3, 3, 23 and USA 8, 14, 68. GROUP BY ROLLUP adds a subtotal for each country (UK 29, USA 90) and a grand total of 119, but no per-genre subtotals. In the result, a NULL in a grouping column marks the column that was summed over. 9 rows in all.</desc>
<defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="arrow-009E73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="arrow-777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arrow-B0558A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0558A"/></marker><marker id="arrow-C98500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98500"/></marker><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">ROLLUP: subtotals along a hierarchy, then a grand total</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">ROLLUP (a, b) groups by (a, b), then (a), then ( ). It never groups by b alone.</text>
