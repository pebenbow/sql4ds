<text x="876" y="352.0" font-size="12" font-weight="normal" fill="#009E73" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">( )</text>
<text x="520" y="388" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">NULL here means "all values", not missing data.</text>
<text x="520" y="408" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">GROUPING(birth_country) returns 1 on rows where that column was summed over.</text>
<rect x="30" y="436" width="560" height="138" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="44" y="458" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT birth_country, primary_genre, COUNT(*) AS actors</text>
<text x="44" y="476" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM actors</text>
<text x="44" y="494" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">WHERE birth_country IN ('UK', 'USA')</text>
<text x="44" y="512" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">  AND primary_genre IN ('Drama', 'Action', 'Comedy')</text>
<text x="44" y="530" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">GROUP BY ROLLUP (birth_country, primary_genre)</text>
<text x="44" y="548" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">ORDER BY birth_country NULLS LAST, primary_genre NULLS LAST;</text>
</svg>
