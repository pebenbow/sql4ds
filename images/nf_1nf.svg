<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 540" width="1305" height="810" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">First normal form: one value per cell</title>
<desc id="desc">The orders table stores lists in two cells: order 1 has products 'Laptop, Mouse' with quantities '1, 2', and order 3 has 'Monitor, Keyboard' with '1, 1'. Splitting each list gives one row per product: 3 rows become 5, and the primary key becomes order_id plus product. Alice's name and email now repeat on 4 rows, which 2NF fixes next.</desc>
