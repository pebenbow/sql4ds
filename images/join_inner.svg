<rect x="355" y="146" width="5" height="26" fill="#0072B2"/>
<text x="363" y="164.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">101</text>
<text x="448" y="164.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">1</text>
<rect x="355" y="172" width="190" height="26" fill="#DCEAF5" stroke="#A0A0A0" stroke-width="1"/>
<rect x="355" y="172" width="5" height="26" fill="#0072B2"/>
<text x="363" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">102</text>
<text x="448" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">1</text>
<rect x="355" y="198" width="190" height="26" fill="#FCEDCC" stroke="#A0A0A0" stroke-width="1"/>
<rect x="355" y="198" width="5" height="26" fill="#C98500"/>
<text x="363" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">103</text>
<text x="448" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">2</text>
