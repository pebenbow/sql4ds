<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 388" width="1075" height="388" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">INNER JOIN: keep only the rows that match</title>
<desc id="desc">customers has Alice (1), Bob (2), and Chen (3). orders has 101 and 102 for customer 1, 103 for customer 2, and 104 for customer 4, who is not in customers. The INNER JOIN returns 3 rows: Alice with 101, Alice with 102, and Bob with 103. Chen and order 104 have no match and are left out.</desc>
<defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="arrow-009E73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="arrow-777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arrow-B0558A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0558A"/></marker><marker id="arrow-C98500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98500"/></marker><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">INNER JOIN: keep only the rows that match</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Each customer is paired with each of its orders. Rows with no partner on the other side are left out.</text>
<text x="95" y="110" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">customers c</text>
<rect x="95" y="120" width="180" height="26" fill="#E4E4E4" stroke="#A0A0A0" stroke-width="1"/>
<text x="103" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">customer_id</text>
<line x1="103" y1="141.0" x2="182.2" y2="141.0" stroke="#222222" stroke-width="1.3"/>
<text x="208" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">name</text>
<rect x="95" y="146" width="180" height="26" fill="#DCEAF5" stroke="#A0A0A0" stroke-width="1"/>
<rect x="95" y="146" width="5" height="26" fill="#0072B2"/>
