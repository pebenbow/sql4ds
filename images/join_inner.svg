<path d="M275,159.0 C315.0,159.0 315.0,159.0 355,159.0" fill="none" stroke="#0072B2" stroke-width="2" stroke-opacity="0.85"/>
<circle cx="275" cy="159.0" r="3.5" fill="#0072B2"/>
