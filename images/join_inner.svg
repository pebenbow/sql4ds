<rect x="95" y="172" width="5" height="26" fill="#C98500"/>
<text x="103" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">2</text>
<text x="208" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Bob</text>
<rect x="95" y="198" width="180" height="26" fill="#D3EFE6" stroke="#A0A0A0" stroke-width="1"/>
<rect x="95" y="198" width="5" height="26" fill="#009E73"/>
<text x="103" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">3</text>
<text x="208" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Chen</text>
<line x1="200" y1="120" x2="200" y2="224" stroke="#A0A0A0" stroke-width="1"/>
<rect x="95" y="120" width="180" height="104" fill="none" stroke="#777777" stroke-width="1.5"/>
<text x="355" y="110" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">orders o</text>
<rect x="355" y="120" width="190" height="26" fill="#E4E4E4" stroke="#A0A0A0" stroke-width="1"/>
<text x="363" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">order_id</text>
