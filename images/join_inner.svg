<text x="87" y="216.0" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="end" font-style="italic">no match</text>
<text x="553" y="242.0" font-size="12" font-weight="bold" fill="#D55E00" text-anchor="start" font-style="italic">no match</text>
<line x1="615" y1="159.0" x2="643" y2="159.0" stroke="#777777" stroke-width="3" marker-end="url(#arrow-777777)"/>
<text x="655" y="110" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">result</text>
<rect x="655" y="120" width="395" height="26" fill="#E4E4E4" stroke="#A0A0A0" stroke-width="1"/>
<text x="663" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">c.customer_id</text>
<text x="778" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">c.name</text>
<text x="848" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">o.order_id</text>
<text x="943" y="138.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">o.customer_id</text>
<rect x="655" y="146" width="395" height="26" fill="#DCEAF5" stroke="#A0A0A0" stroke-width="1"/>
<rect x="655" y="146" width="5" height="26" fill="#0072B2"/>
<text x="663" y="164.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">1</text>
<text x="778" y="164.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Alice</text>
<text x="848" y="164.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">101</text>
<text x="943" y="164.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">1</text>
<rect x="655" y="172" width="395" height="26" fill="#DCEAF5" stroke="#A0A0A0" stroke-width="1"/>
<rect x="655" y="172" width="5" height="26" fill="#0072B2"/>
<text x="663" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">1</text>
<text x="778" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Alice</text>
<text x="848" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">102</text>
<text x="943" y="190.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">1</text>
<rect x="655" y="198" width="395" height="26" fill="#FCEDCC" stroke="#A0A0A0" stroke-width="1"/>
<rect x="655" y="198" width="5" height="26" fill="#C98500"/>
<text x="663" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">2</text>
<text x="778" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Bob</text>
<text x="848" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">103</text>
<text x="943" y="216.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">2</text>
<line x1="770" y1="120" x2="770" y2="224" stroke="#A0A0A0" stroke-width="1"/>
<line x1="840" y1="120" x2="840" y2="224" stroke="#A0A0A0" stroke-width="1"/>
<line x1="935" y1="120" x2="935" y2="224" stroke="#A0A0A0" stroke-width="1"/>
<rect x="655" y="120" width="395" height="104" fill="none" stroke="#777777" stroke-width="1.5"/>
<rect x="95" y="264" width="500" height="100" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="109" y="286" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT c.customer_id, c.name, o.order_id, o.customer_id</text>
<text x="109" y="304" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM customers AS c</text>
<text x="109" y="322" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">INNER JOIN orders AS o</text>
<text x="109" y="340" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">  ON c.customer_id = o.customer_id;</text>
<text x="655" y="286" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">3 rows: Alice appears twice (two orders).</text>
<text x="655" y="306" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Chen (no orders) and order 104 (no customer)</text>
<text x="655" y="326" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">are both left out.</text>
</svg>
