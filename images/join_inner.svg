<circle cx="355" cy="185.0" r="3.5" fill="#0072B2"/>
<path d="M275,185.0 C315.0,185.0 315.0,211.0 355,211.0" fill="none" stroke="#C98500" stroke-width="2" stroke-opacity="0.85"/>
<circle cx="275" cy="185.0" r="3.5" fill="#C98500"/>
