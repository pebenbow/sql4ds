<text x="520" y="304" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">5 rows, not 7.</text>
<text x="520" y="324" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Both copies of Cai become one</text>
<text x="520" y="344" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">row, and so do both copies</text>
<text x="520" y="364" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">of Dev.</text>
<text x="520" y="384" font-size="14" font-weight="normal" fill="#555555" text-anchor="start"></text>
<text x="520" y="404" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">A row is a duplicate only if</text>
<text x="520" y="424" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">every column matches.</text>
<rect x="30" y="452" width="440" height="94" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="44" y="478" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT name, year FROM chess_club</text>
<text x="44" y="496" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">UNION</text>
<text x="44" y="514" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT name, year FROM robotics_club</text>
<text x="44" y="532" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">ORDER BY name;</text>
