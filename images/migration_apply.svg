<rect x="52" y="168" width="365" height="104" fill="none" stroke="#777777" stroke-width="1.5"/>
<rect x="500" y="209.0" width="345" height="80" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="514" y="235.0" font-size="12" font-weight="bold" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">20250203140000_add_email_to_customers.sql</text>
<text x="514" y="257.0" font-size="12" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">ALTER TABLE customers</text>
<text x="514" y="275.0" font-size="12" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">    ADD COLUMN email TEXT;</text>
