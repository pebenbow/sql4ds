<text x="500" y="309.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start" font-style="italic">a new, empty file; you write the SQL in it</text>
<line x1="30" y1="335.0" x2="900" y2="335.0" stroke="#DDDDDD" stroke-width="1"/>
<text x="30" y="359.0" font-size="16" font-weight="bold" fill="#222222"><tspan fill="#D55E00">2</tspan>  Check what is pending</text>
<text x="52" y="381.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">supabase migration list</text>
<rect x="52" y="403.0" width="270" height="26" fill="#E4E4E4" stroke="#A0A0A0" stroke-width="1"/>
<text x="60" y="421.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">local</text>
<text x="195" y="421.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">remote</text>
<rect x="52" y="429.0" width="270" height="26" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
<text x="60" y="447.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250101120000</text>
<text x="195" y="447.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">20250101120000</text>
<rect x="52" y="455.0" width="270" height="26" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
<text x="60" y="473.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250115093000</text>
<text x="195" y="473.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">20250115093000</text>
<rect x="52" y="481.0" width="270" height="26" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
<rect x="54" y="483.0" width="131" height="22" rx="3" fill="#D3EFE6" stroke="#009E73" stroke-width="2"/>
<text x="60" y="499.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250203140000</text>
<rect x="190" y="484.0" width="129" height="20" rx="3" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="1" stroke-dasharray="3 3"/>
