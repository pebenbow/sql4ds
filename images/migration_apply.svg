<text x="590" y="755.0" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">The push records the version it ran,</text>
<text x="590" y="775.0" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">so every later push skips this file.</text>
<text x="590" y="795.0" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Run supabase migration list again and</text>
<text x="590" y="815.0" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">the remote column now matches.</text>
