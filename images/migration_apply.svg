<rect x="52" y="403.0" width="270" height="104.0" fill="none" stroke="#777777" stroke-width="1.5"/>
<text x="352" y="480.0" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Pending: the file exists locally, but the</text>
<text x="352" y="500.0" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">remote database has no record of running it.</text>
<line x1="30" y1="533.0" x2="900" y2="533.0" stroke="#DDDDDD" stroke-width="1"/>
<text x="30" y="557.0" font-size="16" font-weight="bold" fill="#222222"><tspan fill="#D55E00">3</tspan>  Run it on the remote database</text>
<text x="52" y="579.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">supabase db push</text>
<text x="52" y="615.0" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">customers</text>
<text x="135.8" y="615.0" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-style="italic">before</text>
