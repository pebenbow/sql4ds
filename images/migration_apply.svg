<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 845.0" width="1395" height="1267.5" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Creating and applying a migration</title>
<desc id="desc">Three steps for the add_email_to_customers migration. Step 1: supabase migration new creates an empty, timestamped file, 20250203140000_add_email_to_customers.sql, in supabase/migrations next to the two files already there, and you write ALTER TABLE customers ADD COLUMN email TEXT in it. Step 2: supabase migration list shows the new file locally with no matching remote version, so it is pending. Step 3: supabase db push runs the pending file on the remote database. The customers table gains an email column, which is NULL for the three existing customers, and the tracking table supabase_migrations.schema_migrations gains the row 20250203140000, so later pushes skip this file.</desc>
<defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="arrow-009E73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="arrow-777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arrow-C98500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98500"/></marker><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">Creating and applying a migration</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">A new file starts out pending on your machine. supabase db push runs it on the remote database and records that it ran.</text>
<text x="30" y="100" font-size="16" font-weight="bold" fill="#222222"><tspan fill="#D55E00">1</tspan>  Create the file, then write the SQL in it</text>
<text x="52" y="122" font-size="13" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">supabase migration new add_email_to_customers</text>
<text x="52" y="158" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">supabase/migrations/</text>
<rect x="52" y="168" width="365" height="26" fill="#E4E4E4" stroke="#A0A0A0" stroke-width="1"/>
<text x="60" y="186.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">version</text>
<text x="195" y="186.0" font-size="13" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">name</text>
<rect x="52" y="194" width="365" height="26" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
<text x="60" y="212.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250101120000</text>
<text x="195" y="212.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">create_customers_table</text>
<rect x="52" y="220" width="365" height="26" fill="#FFFFFF" stroke="#A0A0A0" stroke-width="1"/>
<text x="60" y="238.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250115093000</text>
<text x="195" y="238.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">create_orders_table</text>
<rect x="52" y="246" width="365" height="26" fill="#D3EFE6" stroke="#A0A0A0" stroke-width="1"/>
<rect x="52" y="246" width="5" height="26" fill="#009E73"/>
<rect x="54" y="248" width="131" height="22" rx="3" fill="#D3EFE6" stroke="#009E73" stroke-width="2"/>
<text x="60" y="264.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250203140000</text>
<rect x="189" y="248" width="226" height="22" rx="3" fill="#D3EFE6" stroke="#009E73" stroke-width="2"/>
<text x="195" y="264.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">add_email_to_customers</text>
