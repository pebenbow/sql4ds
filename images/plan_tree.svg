<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1800" height="1140" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">A query plan as a tree</title>
<desc id="desc">EXPLAIN ANALYZE for a query that joins flights to airlines, keeps flights delayed more than 60 minutes, counts them per airline, and sorts the counts. The plan is a tree read from the bottom up. A sequential scan of airlines (16 rows) feeds a Hash node that builds a hash table. A sequential scan of flights keeps 7,240 of 104,662 rows. The Hash Join matches those 7,240 flights to their airlines, HashAggregate groups them into 13 airlines, and Sort orders the 13 counts.</desc>
<defs><marker id="arrow-009E73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="arrow-777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arrow-C98500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98500"/></marker><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">Reading a query plan: a tree of nodes, run from the bottom up</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Each node takes rows from the nodes below it and passes its own output up. Badges show the order the work happens.</text>
<text x="30" y="98" font-size="14" font-weight="bold" fill="#555555" text-anchor="start">The query</text>
<rect x="30" y="110" width="470" height="174" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="44" y="132" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">EXPLAIN ANALYZE</text>
<text x="44" y="150" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT a.name, COUNT(*) AS n</text>
<text x="44" y="168" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM flights AS f</text>
<text x="44" y="186" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">INNER JOIN airlines AS a</text>
<text x="44" y="204" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">  ON f.carrier = a.carrier</text>
<text x="44" y="222" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">WHERE f.dep_delay &gt; 60</text>
<text x="44" y="240" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">GROUP BY a.name</text>
<text x="44" y="258" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">ORDER BY n DESC;</text>
<text x="30" y="324" font-size="14" font-weight="bold" fill="#555555" text-anchor="start">Its plan (costs and timing trimmed)</text>
<rect x="30" y="336" width="500" height="226" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<circle cx="46" cy="360" r="10" fill="#0072B2"/>
<text x="46" y="364.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="64" y="364" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">Sort  (actual rows=13)</text>
<text x="64" y="382" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">  Sort Key: (count(*)) DESC</text>
<circle cx="46" cy="396" r="10" fill="#0072B2"/>
<text x="46" y="400.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="64" y="400" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">  -&gt;  HashAggregate  (actual rows=13)</text>
<text x="64" y="418" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">        Group Key: a.name</text>
<circle cx="46" cy="432" r="10" fill="#0072B2"/>
<text x="46" y="436.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="64" y="436" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">        -&gt;  Hash Join  (actual rows=7240)</text>
<text x="64" y="454" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">              Hash Cond: (f.carrier = a.carrier)</text>
<circle cx="46" cy="468" r="10" fill="#0072B2"/>
<text x="46" y="472.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="64" y="472" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">              -&gt;  Seq Scan on flights f  (actual rows=7240)</text>
<text x="64" y="490" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">                    Filter: (dep_delay &gt; 60)</text>
<text x="64" y="508" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">                    Rows Removed by Filter: 97422</text>
<circle cx="46" cy="522" r="10" fill="#0072B2"/>
<text x="46" y="526.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="64" y="526" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">              -&gt;  Hash  (actual rows=16)</text>
<circle cx="46" cy="540" r="10" fill="#0072B2"/>
<text x="46" y="544.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="64" y="544" font-size="11.5" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">                    -&gt;  Seq Scan on airlines a  (actual rows=16)</text>
<rect x="875.0" y="670" width="290" height="60" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1.5"/>
<circle cx="893.0" cy="688" r="10" fill="#0072B2"/>
<text x="893.0" y="692.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="911.0" y="693" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Seq Scan on airlines a</text>
<text x="1153.0" y="720" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="end">16 rows out</text>
<rect x="875.0" y="520" width="290" height="78" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1.5"/>
<circle cx="893.0" cy="538" r="10" fill="#0072B2"/>
<text x="893.0" y="542.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="911.0" y="543" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Hash</text>
<text x="889.0" y="564" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">builds a hash table on carrier</text>
<text x="1153.0" y="588" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="end">16 rows out</text>
<rect x="555.0" y="520" width="290" height="96" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1.5"/>
<circle cx="573.0" cy="538" r="10" fill="#0072B2"/>
<text x="573.0" y="542.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="591.0" y="543" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Seq Scan on flights f</text>
<text x="569.0" y="564" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">Filter: dep_delay &gt; 60</text>
<text x="569.0" y="582" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">Rows Removed by Filter: 97,422</text>
<text x="833.0" y="606" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="end">7,240 rows out</text>
<rect x="715.0" y="360" width="290" height="78" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1.5"/>
<circle cx="733.0" cy="378" r="10" fill="#0072B2"/>
<text x="733.0" y="382.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="751.0" y="383" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Hash Join</text>
<text x="729.0" y="404" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">Hash Cond: f.carrier = a.carrier</text>
<text x="993.0" y="428" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="end">7,240 rows out</text>
<rect x="715.0" y="230" width="290" height="78" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1.5"/>
<circle cx="733.0" cy="248" r="10" fill="#0072B2"/>
<text x="733.0" y="252.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="751.0" y="253" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">HashAggregate</text>
<text x="729.0" y="274" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">Group Key: a.name</text>
<text x="993.0" y="298" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="end">13 rows out</text>
<rect x="715.0" y="100" width="290" height="78" rx="8" fill="#FFFFFF" stroke="#777777" stroke-width="1.5"/>
<circle cx="733.0" cy="118" r="10" fill="#0072B2"/>
<text x="733.0" y="122.5" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="751.0" y="123" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Sort</text>
<text x="729.0" y="144" font-size="12" font-weight="normal" fill="#555555" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">Sort Key: count(*) DESC</text>
<text x="993.0" y="168" font-size="12" font-weight="bold" fill="#0072B2" text-anchor="end">13 rows out</text>
<path d="M1020,668 C1020,634.0 1020,634.0 1020,610" fill="none" stroke="#0072B2" stroke-width="2.9" stroke-opacity="0.75"/>
<path d="M1012,612 L1020,600 L1028,612 Z" fill="#0072B2"/>
<path d="M1020,518 C1020,479.0 860,479.0 860,450" fill="none" stroke="#0072B2" stroke-width="2.9" stroke-opacity="0.75"/>
<path d="M852,452 L860,440 L868,452 Z" fill="#0072B2"/>
<path d="M700,518 C700,479.0 860,479.0 860,450" fill="none" stroke="#0072B2" stroke-width="6.1" stroke-opacity="0.75"/>
<path d="M852,452 L860,440 L868,452 Z" fill="#0072B2"/>
<path d="M860,358 C860,334.0 860,334.0 860,320" fill="none" stroke="#0072B2" stroke-width="6.1" stroke-opacity="0.75"/>
<path d="M852,322 L860,310 L868,322 Z" fill="#0072B2"/>
<path d="M860,228 C860,204.0 860,204.0 860,190" fill="none" stroke="#0072B2" stroke-width="2.8" stroke-opacity="0.75"/>
<path d="M852,192 L860,180 L868,192 Z" fill="#0072B2"/>
<text x="700" y="640" font-size="12" font-weight="normal" fill="#555555" text-anchor="middle" font-style="italic">line width shows how many rows</text>
<text x="700" y="656" font-size="12" font-weight="normal" fill="#555555" text-anchor="middle" font-style="italic">flow up each edge</text>
</svg>
