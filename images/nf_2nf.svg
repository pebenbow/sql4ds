<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Second normal form: no partial dependencies</title>
<desc id="desc">In the 1NF orders table the primary key is (order_id, product). quantity depends on the whole key, but customer, email, and order_date depend on order_id alone, a partial dependency. Moving those columns to an orders table keyed by order_id leaves order_items with order_id, product, and quantity. Alice's email goes from 4 copies to 2.</desc>
