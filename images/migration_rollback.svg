<text x="496" y="612" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">The undo is a reviewed, recorded step, and</text>
<text x="496" y="632" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">every database replays it the same way.</text>
<text x="496" y="652" font-size="14" font-weight="normal" fill="#555555" text-anchor="start"></text>
<text x="496" y="672" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Dropping the column deletes the emails stored</text>
<text x="496" y="692" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">in it. Reversing a change can still lose data.</text>
