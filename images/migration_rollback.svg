<rect x="496" y="552" width="5" height="26" fill="#009E73"/>
<rect x="498" y="554" width="146" height="22" rx="3" fill="#D3EFE6" stroke="#009E73" stroke-width="2"/>
<text x="504" y="570.0" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">20250212101500</text>
