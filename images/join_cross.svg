<text x="44" y="260" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT s.size, c.color</text>
<text x="44" y="278" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM sizes AS s</text>
<text x="44" y="296" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">CROSS JOIN colors AS c;</text>
<text x="685" y="164.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">S with each color</text>
<text x="685" y="216.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">M with each color</text>
<text x="685" y="268.0" font-size="13" font-weight="normal" fill="#555555" text-anchor="start">L with each color</text>
<text x="30" y="342" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">Row count multiplies: a 1,000-row table crossed with a 1,000-row table is 1,000,000 rows.</text>
