<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 468" width="1515" height="702" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">An uncorrelated subquery runs once</title>
<desc id="desc">The scalar subquery SELECT AVG(dep_delay) FROM flights does not refer to the outer query. It reads all 8 flights on its own, runs one time, and returns 9.75. That one value is attached to every one of the 8 outer rows as overall_avg.</desc>
<defs><marker id="arrow-0072B2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker><marker id="arrow-009E73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker><marker id="arrow-777777" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker><marker id="arrow-C98500" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98500"/></marker><marker id="arrow-D55E00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#222222" text-anchor="start">An uncorrelated subquery runs once</text>
<text x="30" y="60" font-size="14" font-weight="normal" fill="#555555" text-anchor="start">The inner query never looks at the outer row, so the answer from its one run is reused on every row.</text>
<rect x="30" y="80" width="580" height="84" rx="8" fill="#FAFAFA" stroke="#A0A0A0" stroke-width="1.5"/>
<text x="44" y="102" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">SELECT flight, carrier, dep_delay,</text>
<text x="44" y="120" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">       (SELECT AVG(dep_delay) FROM flights) AS overall_avg</text>
<text x="44" y="138" font-size="13" font-weight="normal" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">FROM flights f;</text>
<text x="30" y="194" font-size="14" font-weight="bold" fill="#222222" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">outer: flights f</text>
<rect x="30" y="204" width="230" height="26" fill="#E4E4E4" stroke="#A0A0A0" stroke-width="1"/>
