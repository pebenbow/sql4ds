# Data dictionary for the murdermystery database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: murdermystery
summary: |
  The `murdermystery` database holds the records of a fictional town: 10,005 residents in the
  central `person` table, along with their driver's licenses, incomes, police interviews, gym
  memberships and visits, social media event check-ins, and 1,228 crime scene reports. All eight
  tables together hold about 56,000 rows.

  It is the SQL Murder Mystery, an inquiry-based exercise. A murder has been committed, and
  students solve it by following clues from one table to the next, writing a new query at each
  step to narrow the list of suspects. A `check_murderer()` function in the database takes a
  suspect's name and reports whether the guess is right, so students get feedback without an
  answer key.
source: |
  The SQL Murder Mystery was created by Knight Lab at Northwestern University (the NUKnightLab
  project). This version loads the original tables into PostgreSQL. The `check_murderer()`
  function is not part of the original project, which checked answers by inserting a guess into
  a separate solution table. It was added here so students can verify a guess with a single
  query.
concepts:
- concept: A hub table
  example: |
    `person` sits at the center of the schema. `interview`, `income`, `get_fit_now_member`, and
    `facebook_event_checkin` all reference it, and it references `drivers_license` in turn, so
    almost every investigation passes through `person`.
- concept: One-to-one relationships
  example: |
    `interview.person_id` is both the whole primary key and a foreign key to `person.id`, so a
    person has at most one interview. `income.ssn` plays the same double role for incomes.
- concept: A foreign key that references a UNIQUE column rather than a primary key
  example: |
    `income.ssn` references `person.ssn`, which is not the primary key of `person` but is declared
    `UNIQUE`. Any column guaranteed to be unique can be the target of a foreign key.
- concept: A chain of joins
  example: |
    Getting from a gym visit to a car takes three joins: `get_fit_now_check_in` to
    `get_fit_now_member` on `membership_id`, then to `person` on `person_id`, then to
    `drivers_license` on `license_id`.
- concept: A table with no relationships
  example: |
    `crime_scene_report` has no foreign keys and nothing references it. It is searched on its own
    by `date`, `type`, and `city`, and the clues it contains have to be carried to other tables by
    hand.
- concept: Optional rows on the other side of a relationship
  example: |
    Every person has a license, but only 7,514 of the 10,005 people have an `income` row and only
    4,991 have an `interview`. An `INNER JOIN` to either table silently drops everyone else, while
    a `LEFT JOIN` keeps them.
extra_chapters: []
tables:
- name: person
  description: |
    One row per resident of the town, 10,005 in all. This is the central table of the database:
    most of the other tables describe something about a person and reference this table.

    Each person has a driver's license through `license_id`, which references `drivers_license`,
    and a unique Social Security number, which `income` references. `interview`,
    `get_fit_now_member`, and `facebook_event_checkin` all refer back to `person.id`.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Five-digit identifier for the person, from 10000 to 99990. Referenced by `interview`, `get_fit_now_member`, and `facebook_event_checkin`.
  - name: name
    type: varchar(50)
    nullable: true
    description: Full name, first name then last name, such as `Dewitt Varas`. Every name is distinct.
  - name: license_id
    type: integer
    key: FK
    nullable: true
    references: drivers_license.id
    description: The person's driver's license. Every person has one, and no two people share a license.
  - name: address_number
    type: integer
    nullable: true
    description: House number of the person's street address, such as `2305`.
  - name: address_street_name
    type: varchar(50)
    nullable: true
    description: Street name of the person's address, such as `Hull Dr`. Most streets have only one resident.
  - name: ssn
    type: integer
    key: UQ
    nullable: true
    description: Nine-digit Social Security number, stored as an integer. Unique to each person and referenced by `income.ssn`.
- name: drivers_license
  description: |
    One row per driver's license, 10,007 in all. Besides the license itself, each row records the
    holder's physical description and the car registered to them, which makes this the table to
    search when a clue describes what someone looks like or drives.

    The table has no column naming its holder. To find out whose license it is, join to `person`
    on `person.license_id`. Two licenses belong to no one in `person`.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Six-digit license number. Referenced by `person.license_id`.
  - name: age
    type: integer
    nullable: true
    description: Age of the license holder in years, from 18 to 89.
  - name: height
    type: integer
    nullable: true
    description: Height of the license holder, from 50 to 84 (consistent with inches).
  - name: eye_color
    type: varchar(10)
    nullable: true
    description: Eye color, one of `amber`, `black`, `blue`, `brown`, or `green`.
  - name: hair_color
    type: varchar(10)
    nullable: true
    description: Hair color, such as `black`, `blonde`, or `red`. Eight colors appear, including `blue` and `green`.
  - name: gender
    type: varchar(10)
    nullable: true
    description: Gender of the license holder, recorded as `female` or `male`.
  - name: plate_number
    type: varchar(10)
    nullable: true
    description: License plate of the holder's car, six letters and digits such as `P24L4U`. Every plate is distinct.
  - name: car_make
    type: varchar(20)
    nullable: true
    description: Manufacturer of the car, such as `Chevrolet` or `Toyota`.
  - name: car_model
    type: varchar(20)
    nullable: true
    description: Model of the car, such as `MDX` or `Rogue`.
- name: interview
  description: |
    One row per police interview, 4,991 in all, holding a transcript of what the person said. Its
    primary key, `person_id`, is also a foreign key to `person`, so each interview belongs to
    exactly one person and no person is interviewed twice.

    Only a handful of transcripts matter to the case. The rest are filler text, much of it lines
    from *Alice's Adventures in Wonderland*, and 1,253 transcripts are `NULL`.
  columns:
  - name: person_id
    type: integer
    key: PK, FK
    nullable: false
    references: person.id
    description: The person who was interviewed. Join to `person` for their name.
  - name: transcript
    type: text
    nullable: true
    description: What the person said in the interview. `NULL` for 1,253 interviews.
- name: income
  description: |
    Annual income for 7,514 people, one row each. The table is keyed by Social Security number
    rather than by `person.id`: `ssn` is both its primary key and a foreign key to `person.ssn`.

    Not every person appears here. Joining `person` to `income` with an `INNER JOIN` keeps only
    the 7,514 people whose income is on record.
  columns:
  - name: ssn
    type: integer
    key: PK, FK
    nullable: false
    references: person.ssn
    description: Nine-digit Social Security number of the earner. Matches `person.ssn`.
  - name: annual_income
    type: integer
    nullable: true
    description: Yearly income in dollars, from 10,000 to 498,500.
- name: get_fit_now_member
  description: |
    One row per member of the Get Fit Now gym, 183 in all. Each member is a person in the town,
    linked through `person_id`, and each has a membership ID that the gym's visit log uses.

    This table is the bridge between `person` and `get_fit_now_check_in`: a visit records only the
    membership ID, so finding out who visited means joining through this table.
  columns:
  - name: id
    type: varchar(10)
    key: PK
    nullable: false
    description: Five-character membership ID of letters and digits, such as `NL318`. Referenced by `get_fit_now_check_in.membership_id`.
  - name: person_id
    type: integer
    key: FK
    nullable: true
    references: person.id
    description: The person who holds the membership. No person holds more than one.
  - name: name
    type: varchar(50)
    nullable: true
    description: Member's full name. Repeats `person.name` for the same person.
  - name: membership_start_date
    type: date
    nullable: true
    description: Date the membership began, between January 1, 2016, and April 28, 2018.
  - name: membership_status
    type: varchar(10)
    nullable: true
    description: Membership level, one of `regular`, `silver`, or `gold`.
- name: get_fit_now_check_in
  description: |
    The gym's visit log: one row per visit, 2,678 in all, from January 1, 2017, through May 1,
    2018. Each row records the date and the times the member checked in and out.

    A visit refers to its member only by `membership_id`. To reach the visitor's name, license, or
    any other personal detail, join to `get_fit_now_member` and then to `person`. One member has no
    visits on record.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Identifier for the visit.
  - name: membership_id
    type: varchar(10)
    key: FK
    nullable: true
    references: get_fit_now_member.id
    description: Membership ID of the member who visited, such as `NL318`.
  - name: check_in_date
    type: date
    nullable: true
    description: Date of the visit.
  - name: check_in_time
    type: time
    nullable: true
    description: Time of day the member checked in, between 5:00 AM and 10:59 PM.
  - name: check_out_time
    type: time
    nullable: true
    description: |
      Time of day the member checked out. In 196 visits it is earlier than `check_in_time`, so do
      not assume every visit ends after it starts.
- name: facebook_event_checkin
  description: |
    One row each time a person checked in to an event on Facebook, 19,441 in all, dated from
    January 1, 2017, through May 1, 2018. This is the largest table in the database. Each check-in
    references `person` through `person_id`, and 9,743 different people appear.

    There is no separate events table. The event's ID and name are stored on every check-in, and
    they do not line up consistently: the same `event_id` appears with many different names and
    dates.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Identifier for the check-in.
  - name: person_id
    type: integer
    key: FK
    nullable: true
    references: person.id
    description: The person who checked in.
  - name: event_id
    type: integer
    nullable: true
    description: Identifier for the event. Not a foreign key, and not reliably tied to a single `event_name` or `date`.
  - name: event_name
    type: varchar(100)
    nullable: true
    description: Name of the event. Mostly filler text such as quotations. `NULL` for 273 check-ins.
  - name: date
    type: date
    nullable: true
    description: Date of the check-in.
- name: crime_scene_report
  description: |
    One row per police report, 1,228 in all, each recording the date, type of crime, city, and a
    description of what happened. Reports span January 1, 2017, through May 1, 2018, and cover
    nine types of crime across 377 cities.

    The table stands alone: it has no foreign keys, and no other table references it. Students
    usually start the mystery here, filtering on `date`, `type`, and `city` to find the report for
    the murder. Most other descriptions are filler text.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Identifier for the report.
  - name: date
    type: date
    nullable: true
    description: Date of the crime.
  - name: type
    type: varchar(20)
    nullable: true
    description: Kind of crime, one of `arson`, `assault`, `blackmail`, `bribery`, `fraud`, `murder`, `robbery`, `smuggling`, or `theft`.
  - name: description
    type: text
    nullable: true
    description: What the report says happened. Usually filler text, and `NULL` for 289 reports.
  - name: city
    type: varchar(20)
    nullable: true
    description: City where the crime took place, such as `Albany` or `Reno`.
