# Data dictionary for the northwind database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: northwind
summary: |
  The `northwind` database holds the sales records of Northwind Traders, a fictional company
  that imports and sells specialty foods. At its center are 830 orders in `orders` and the 2,155
  line items in `order_details` that say which products each order contained. Around them sit the
  77 products and their 8 categories and 29 suppliers, 91 customers, 9 employees with their sales
  territories and regions, and the shipping companies that carried the orders. Order dates run
  from July 2022 to May 2024.

  Northwind is a classic teaching schema because it looks like the database behind an ordinary
  small business. Answering everyday questions, such as which employee sold the most or which
  category brings in the most revenue, takes several joins, and the schema shows many of the
  standard design patterns in one place: lookup tables, junction tables with composite keys, and
  a table that references itself.
source: |
  Northwind was created by Microsoft as a sample database for Microsoft Access and later shipped
  with SQL Server. Traces of that origin remain in the data, such as supplier home pages that use
  the Access hyperlink format and point to `microsoft.com/accessdev`. This PostgreSQL version was
  prepared for the open-sql-docker project, which loads it from pipe-delimited text files. In this
  version the order dates fall in 2022 through 2024.
concepts:
- concept: A self-referencing foreign key
  example: |
    `employees.reports_to` references `employees.employee_id`, so each employee row can point to
    their manager in the same table. Listing employees beside their managers means joining
    `employees` to itself under two aliases.
- concept: Many-to-many relationships through junction tables
  example: |
    An order contains many products and a product appears in many orders, so `order_details`
    sits between `orders` and `products` with the composite key `(order_id, product_id)`.
    `employee_territories` does the same for employees and territories.
- concept: Attributes that belong to a relationship
  example: |
    `order_details.unit_price`, `quantity`, and `discount` describe one product on one order, so
    they live on the junction table. The line's `unit_price` is the price at the time of sale and
    differs from the current `products.unit_price` on 666 of the 2,155 lines.
- concept: A foreign key whose name does not match its target
  example: |
    `orders.ship_via` references `shippers.shipper_id`. Nothing in the column name says which
    table it points to, so a join condition has to come from the schema rather than from
    matching names.
- concept: Text natural keys alongside integer keys
  example: |
    `customers.customer_id` is a five-letter code such as `ALFKI`, and `territories.territory_id`
    is a ZIP code stored as text so that leading zeros like `01581` survive. Most other tables
    use integer keys.
- concept: Parent rows with no children
  example: |
    Only three of the six shippers ever carried an order, customers `FISSA` and `PARIS` placed no
    orders, and four territories have no employee. A `LEFT JOIN` keeps those rows, and an
    `INNER JOIN` silently drops them.
- concept: Empty tables
  example: |
    `customer_demographics` and its junction table `customer_customer_demo` are part of the schema
    but contain no rows, so any query that joins through them returns nothing.
extra_chapters: []
tables:
- name: orders
  description: |
    One row per customer order, 830 in all, placed between July 4, 2022 and May 6, 2024. Together
    with `order_details` this is the center of the database.

    Each order references the customer who placed it (`customer_id`), the employee who took it
    (`employee_id`), and the shipper that carried it (`ship_via`). The products on the order are
    not stored here: they are rows in `order_details` that share the order's `order_id`. The
    `ship_` columns hold the delivery address for the order, which usually but not always matches
    the customer's own name and address.
  columns:
  - name: order_id
    type: integer
    key: PK
    nullable: false
    description: Unique order number, from `10248` to `11077`. Referenced by `order_details.order_id`.
  - name: customer_id
    type: varchar(5)
    key: FK
    nullable: true
    references: customers.customer_id
    description: Five-letter code of the customer who placed the order, such as `VINET`.
  - name: employee_id
    type: integer
    key: FK
    nullable: true
    references: employees.employee_id
    description: Employee who took the order.
  - name: order_date
    type: date
    nullable: true
    description: Date the order was placed, from 2022-07-04 to 2024-05-06.
  - name: required_date
    type: date
    nullable: true
    description: Date by which the customer needed the order delivered.
  - name: shipped_date
    type: date
    nullable: true
    description: Date the order shipped. `NULL` for 21 orders, all placed in April or May 2024, that had not yet shipped.
  - name: ship_via
    type: integer
    key: FK
    nullable: true
    references: shippers.shipper_id
    description: Shipper that carried the order. Only shippers `1`, `2`, and `3` appear.
  - name: freight
    type: numeric(10,2)
    nullable: true
    description: Shipping charge for the order, from `0.02` to `1007.64`.
  - name: ship_name
    type: varchar(40)
    nullable: true
    description: Name of the recipient, usually the customer's company name.
  - name: ship_address
    type: varchar(60)
    nullable: true
    description: Street address the order was shipped to.
  - name: ship_city
    type: varchar(15)
    nullable: true
    description: City the order was shipped to.
  - name: ship_region
    type: varchar(15)
    nullable: true
    description: State, province, or other region of the shipping address, such as `SP` or `WA`. `NULL` for 507 orders sent to countries where the address has no region.
  - name: ship_postal_code
    type: varchar(10)
    nullable: true
    description: Postal code of the shipping address, stored as text because many are not numbers.
  - name: ship_country
    type: varchar(15)
    nullable: true
    description: Country the order was shipped to. 21 countries appear.
- name: order_details
  description: |
    One row per product on an order: 2,155 line items across the 830 orders. This is a junction
    table that resolves the many-to-many relationship between `orders` and `products`, and its
    composite primary key `(order_id, product_id)` means a product appears at most once on any
    order.

    Besides the two keys, each row records the price, quantity, and discount for that line. The
    revenue from a line is `unit_price * quantity * (1 - discount)`.
  columns:
  - name: order_id
    type: integer
    key: PK, FK
    nullable: false
    references: orders.order_id
    description: Order this line belongs to.
  - name: product_id
    type: integer
    key: PK, FK
    nullable: false
    references: products.product_id
    description: Product sold on this line.
  - name: unit_price
    type: numeric(9,2)
    nullable: true
    description: Price per unit charged on this order. It can differ from `products.unit_price`, which holds the current list price.
  - name: quantity
    type: integer
    nullable: true
    description: Number of units ordered, from 1 to 130.
  - name: discount
    type: numeric(5,2)
    nullable: true
    description: Discount as a fraction of the price, so `0.15` means 15% off. Most lines have `0`, and the largest discount is `0.25`.
- name: products
  description: |
    The 77 products Northwind Traders sells, one row per product. Each product belongs to one
    category and comes from one supplier, through the foreign keys `category_id` and
    `supplier_id`.

    The table also tracks inventory: how many units are in stock, how many are on order from the
    supplier, and the stock level at which the product should be reordered. Products that are no
    longer sold remain in the table, flagged by `discontinued`, because past orders still refer to
    them.
  columns:
  - name: product_id
    type: integer
    key: PK
    nullable: false
    description: Unique product number, 1 through 77. Referenced by `order_details.product_id`.
  - name: product_name
    type: varchar(40)
    nullable: true
    description: Name of the product, such as `Chai` or `Aniseed Syrup`.
  - name: supplier_id
    type: integer
    key: FK
    nullable: true
    references: suppliers.supplier_id
    description: Supplier the product is bought from.
  - name: category_id
    type: integer
    key: FK
    nullable: true
    references: categories.category_id
    description: Category the product belongs to.
  - name: quantity_per_unit
    type: varchar(20)
    nullable: true
    description: Free-text description of what one unit contains, such as `24 - 12 oz bottles`.
  - name: unit_price
    type: numeric(10,2)
    nullable: true
    description: Current list price per unit, from `2.50` to `263.50`.
  - name: units_in_stock
    type: integer
    nullable: true
    description: Number of units currently in inventory.
  - name: units_on_order
    type: integer
    nullable: true
    description: Number of units ordered from the supplier but not yet received. Nonzero for 17 products.
  - name: reorder_level
    type: integer
    nullable: true
    description: Stock level at or below which the product should be reordered.
  - name: discontinued
    type: integer
    nullable: true
    description: '`1` if the product is no longer sold, `0` otherwise. Ten products are discontinued.'
- name: categories
  description: |
    A lookup table of the 8 product categories, such as `Beverages`, `Condiments`, and `Seafood`.
    Each category groups many products through `products.category_id`.
  columns:
  - name: category_id
    type: integer
    key: PK
    nullable: false
    description: Unique category number, 1 through 8. Referenced by `products.category_id`.
  - name: category_name
    type: varchar(15)
    nullable: true
    description: Name of the category, such as `Dairy Products`.
  - name: description
    type: text
    nullable: true
    description: Short description of what the category includes, such as `Soft drinks, coffees, teas, beers, and ales`.
  - name: picture
    type: bytea
    nullable: true
    description: Meant to hold an image of the category as binary data. In this version every value is empty (zero bytes) rather than `NULL`.
- name: suppliers
  description: |
    The 29 companies that supply Northwind's products, located in 16 countries. Each supplier
    provides one or more products through `products.supplier_id`. The contact and address columns
    follow the same pattern as `customers`.
  columns:
  - name: supplier_id
    type: integer
    key: PK
    nullable: false
    description: Unique supplier number. Referenced by `products.supplier_id`.
  - name: company_name
    type: varchar(40)
    nullable: true
    description: Name of the supplier, such as `Exotic Liquids`.
  - name: contact_name
    type: varchar(30)
    nullable: true
    description: Name of the person Northwind deals with at the supplier.
  - name: contact_title
    type: varchar(30)
    nullable: true
    description: Job title of the contact, such as `Purchasing Manager`.
  - name: address
    type: varchar(60)
    nullable: true
    description: Street address of the supplier.
  - name: city
    type: varchar(15)
    nullable: true
    description: City of the supplier.
  - name: region
    type: varchar(15)
    nullable: true
    description: State, province, or other region, such as `LA` or `Asturias`. `NULL` for 20 suppliers.
  - name: postal_code
    type: varchar(10)
    nullable: true
    description: Postal code, stored as text.
  - name: country
    type: varchar(15)
    nullable: true
    description: Country of the supplier.
  - name: phone
    type: varchar(24)
    nullable: true
    description: Phone number, stored as text in the local format of the supplier's country.
  - name: fax
    type: varchar(24)
    nullable: true
    description: Fax number. `NULL` for 16 suppliers.
  - name: homepage
    type: text
    nullable: true
    description: Web page in Access hyperlink format, with parts separated by `#`, such as `#CAJUN.HTM#`. `NULL` for 24 suppliers.
- name: customers
  description: |
    The 91 companies that buy from Northwind Traders, one row per customer, in 21 countries. Each
    customer is identified by a five-letter text code that abbreviates the company name, such as
    `ALFKI` for Alfreds Futterkiste, rather than by a number.

    A customer can place many orders through `orders.customer_id`. Two customers, `FISSA` and
    `PARIS`, have placed none.
  columns:
  - name: customer_id
    type: varchar(5)
    key: PK
    nullable: false
    description: Five-letter customer code, such as `ALFKI`. Referenced by `orders.customer_id` and `customer_customer_demo.customer_id`.
  - name: company_name
    type: varchar(40)
    nullable: true
    description: Name of the customer's company, such as `Alfreds Futterkiste`.
  - name: contact_name
    type: varchar(30)
    nullable: true
    description: Name of the person Northwind deals with at the company.
  - name: contact_title
    type: varchar(30)
    nullable: true
    description: Job title of the contact, such as `Owner` or `Sales Representative`.
  - name: address
    type: varchar(60)
    nullable: true
    description: Street address of the customer.
  - name: city
    type: varchar(15)
    nullable: true
    description: City of the customer, such as `Berlin` or `México D.F.`
  - name: region
    type: varchar(15)
    nullable: true
    description: State, province, or other region, such as `SP` or `OR`. `NULL` for 60 customers whose addresses have no region.
  - name: postal_code
    type: varchar(10)
    nullable: true
    description: Postal code, stored as text because formats such as `WA1 1DP` include letters. `NULL` for one customer in Cork, Ireland.
  - name: country
    type: varchar(15)
    nullable: true
    description: Country of the customer. The most common are `USA`, `France`, and `Germany`.
  - name: phone
    type: varchar(24)
    nullable: true
    description: Phone number, stored as text in the local format of the customer's country.
  - name: fax
    type: varchar(24)
    nullable: true
    description: Fax number. `NULL` for 22 customers.
- name: customer_demographics
  description: |
    Meant to hold a list of customer types, such as market segments, that customers could be
    assigned to through `customer_customer_demo`. The table is empty in this database.
  columns:
  - name: customer_type_id
    type: varchar(5)
    key: PK
    nullable: false
    description: Code identifying a customer type. Referenced by `customer_customer_demo.customer_type_id`.
  - name: customer_desc
    type: text
    nullable: true
    description: Description of the customer type.
- name: customer_customer_demo
  description: |
    A junction table meant to link customers to customer types, so that one customer could belong
    to several types and one type could include many customers. Its composite primary key is
    `(customer_id, customer_type_id)`. Like `customer_demographics`, it is empty.
  columns:
  - name: customer_id
    type: varchar(5)
    key: PK, FK
    nullable: false
    references: customers.customer_id
    description: Customer being classified.
  - name: customer_type_id
    type: varchar(5)
    key: PK, FK
    nullable: false
    references: customer_demographics.customer_type_id
    description: Customer type assigned to the customer.
- name: employees
  description: |
    The 9 Northwind employees, one row per person: six sales representatives, two managers, and
    an inside sales coordinator, based in the Seattle area and in London. Each employee takes
    orders through `orders.employee_id` and covers sales territories through
    `employee_territories`.

    The `reports_to` column is a foreign key back to this same table. Eight employees report to
    a manager, and the vice president of sales, Andrew Fuller, reports to no one, so their
    `reports_to` is `NULL`.
  columns:
  - name: employee_id
    type: integer
    key: PK
    nullable: false
    description: Unique employee number, 1 through 9. Referenced by `orders.employee_id`, `employee_territories.employee_id`, and `employees.reports_to`.
  - name: last_name
    type: varchar(20)
    nullable: true
    description: Employee's family name, such as `Davolio`.
  - name: first_name
    type: varchar(10)
    nullable: true
    description: Employee's given name, such as `Nancy`.
  - name: title
    type: varchar(30)
    nullable: true
    description: Job title, such as `Sales Representative` or `Sales Manager`.
  - name: title_of_courtesy
    type: varchar(25)
    nullable: true
    description: Honorific used before the name, such as `Ms.`, `Mr.`, or `Dr.`
  - name: birth_date
    type: date
    nullable: true
    description: Date of birth.
  - name: hire_date
    type: date
    nullable: true
    description: Date the employee was hired, from 1992 to 1994, about thirty years before the earliest order in `orders`.
  - name: address
    type: varchar(60)
    nullable: true
    description: Employee's home street address.
  - name: city
    type: varchar(15)
    nullable: true
    description: City of the home address, such as `Seattle` or `London`.
  - name: region
    type: varchar(15)
    nullable: true
    description: State of the home address. `WA` for the US employees and `NULL` for those in the UK.
  - name: postal_code
    type: varchar(10)
    nullable: true
    description: Postal code of the home address, stored as text.
  - name: country
    type: varchar(15)
    nullable: true
    description: Country of the home address, either `USA` or `UK`.
  - name: home_phone
    type: varchar(24)
    nullable: true
    description: Home phone number, stored as text.
  - name: extension
    type: varchar(4)
    nullable: true
    description: Office phone extension, such as `5467`.
  - name: photo
    type: bytea
    nullable: true
    description: Meant to hold the employee's photo as binary image data. In this version every value is empty (zero bytes) rather than `NULL`.
  - name: notes
    type: text
    nullable: true
    description: A paragraph of biographical notes on the employee's education and career.
  - name: reports_to
    type: integer
    key: FK
    nullable: true
    references: employees.employee_id
    description: '`employee_id` of the employee''s manager, either `2` or `5`. `NULL` for the vice president of sales, who has no manager.'
  - name: photo_path
    type: varchar(255)
    nullable: true
    description: URL of a photo file on a company intranet that does not exist. Several employees share the same path.
- name: employee_territories
  description: |
    A junction table that assigns employees to the sales territories they cover. An employee can
    cover several territories, and the composite primary key `(employee_id, territory_id)` keeps
    any pairing from appearing twice. Its 49 rows cover 49 of the 53 territories, so each covered
    territory has exactly one employee.
  columns:
  - name: employee_id
    type: integer
    key: PK, FK
    nullable: false
    references: employees.employee_id
    description: Employee assigned to the territory.
  - name: territory_id
    type: varchar(20)
    key: PK, FK
    nullable: false
    references: territories.territory_id
    description: Territory the employee covers.
- name: territories
  description: |
    The 53 US sales territories, each identified by a ZIP code and named for a city, such as
    `Boston` or `Bedford`. Each territory belongs to one of the four sales regions through
    `region_id`, and employees are assigned to territories through `employee_territories`.
  columns:
  - name: territory_id
    type: varchar(20)
    key: PK
    nullable: false
    description: Five-digit ZIP code identifying the territory, stored as text so that leading zeros like `01581` are kept.
  - name: territory_description
    type: varchar(60)
    nullable: true
    description: City name for the territory. Some names are cut short in the source data, such as `Georgetow`.
  - name: region_id
    type: integer
    key: FK
    nullable: true
    references: region.region_id
    description: Sales region the territory belongs to.
- name: region
  description: |
    A lookup table of Northwind's four sales regions: `Eastern`, `Western`, `Northern`, and
    `Southern`. Each region contains many territories through `territories.region_id`.
  columns:
  - name: region_id
    type: integer
    key: PK
    nullable: false
    description: Unique region number, 1 through 4. Referenced by `territories.region_id`.
  - name: region_description
    type: varchar(60)
    nullable: true
    description: Name of the region, such as `Eastern`.
- name: shippers
  description: |
    The shipping companies that can carry Northwind's orders, one row per company. An order names
    its shipper through `orders.ship_via`. Only the first three of the six shippers, `Speedy
    Express`, `United Package`, and `Federal Shipping`, appear on any order.
  columns:
  - name: shipper_id
    type: integer
    key: PK
    nullable: false
    description: Unique shipper number, 1 through 6. Referenced by `orders.ship_via`.
  - name: company_name
    type: varchar(40)
    nullable: true
    description: Name of the shipping company, such as `United Package` or `DHL`.
  - name: phone
    type: varchar(24)
    nullable: true
    description: Phone number, stored as text.
- name: us_states
  description: |
    A reference list of the 50 US states plus the District of Columbia, with each state's
    abbreviation and a broad region. No foreign key connects it to any other table, but its
    `state_abbr` values match the two-letter `region` codes used in US addresses elsewhere in the
    database.
  columns:
  - name: state_id
    type: integer
    key: PK
    nullable: false
    description: Unique state number, assigned in alphabetical order of state name.
  - name: state_name
    type: varchar(100)
    nullable: true
    description: Full name of the state, such as `Alabama`.
  - name: state_abbr
    type: varchar(2)
    nullable: true
    description: Two-letter postal abbreviation, such as `AL`.
  - name: state_region
    type: varchar(50)
    nullable: true
    description: Broad region in lowercase, one of `east`, `west`, `north`, `south`, or `midwest`. These do not match the sales regions in `region`.
