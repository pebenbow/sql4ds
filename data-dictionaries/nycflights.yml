# Data dictionary for the nycflights database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: nycflights
summary: |
  The `nycflights` database records every scheduled domestic flight that departed New York's
  LaGuardia Airport (LGA) in 2013: 104,662 flights in all. Around that central `flights` table
  sit four supporting tables that describe the airlines, airports, and aircraft involved and the
  hourly weather at LaGuardia.

  It is the book's main dataset for analysis. The `flights` table is large enough that
  aggregation, window functions, and indexes behave the way they do on production data, and its
  delay columns are full of the `NULL`s that cancelled and diverted flights leave behind.
source: |
  The data comes from the `nycflights13` R package by Hadley Wickham, which gathers flight
  records from the US Bureau of Transportation Statistics, aircraft details from the FAA's
  aircraft registry, airport details from OpenFlights, and weather observations from the Iowa
  Environmental Mesonet. This version keeps only the flights
  and weather for LaGuardia, one of the package's three New York airports.
concepts:
- concept: Composite primary keys
  example: |
    No single column identifies a flight, so `flights` uses a six-column key: the date, carrier,
    flight number, and origin. `weather` is keyed by its station and hour, `(origin, time_hour)`.
- concept: A column that is both a primary key and a foreign key
  example: |
    `flights.carrier` and `flights.origin` are part of the flight's key and also reference
    `airlines` and `airports`. `weather.origin` plays the same double role.
- concept: Two foreign keys to the same table
  example: |
    `flights.origin` and `flights.dest` both reference `airports.faa`, so joining a flight to both
    of its airports means joining `airports` twice under different aliases.
- concept: Optional (nullable) foreign keys
  example: |
    `flights.tailnum` and `flights.dest` may be `NULL`, which is why their lines end in "zero or
    one" at the parent table: a flight can exist without a known aircraft.
- concept: NULL as missing data
  example: |
    Cancelled flights have no departure or arrival times, and diverted flights have no arrival
    delay. Aggregates such as `AVG(dep_delay)` quietly skip those rows.
- concept: Joining on more than a declared key
  example: |
    No foreign key connects `flights` to `weather`, but the two match on `origin` and `time_hour`,
    so a join can attach the conditions at departure time to each flight.
extra_chapters: []
tables:
- name: flights
  description: |
    One row per scheduled flight departing LaGuardia in 2013. This is the central table of the
    database: every other table describes something a flight refers to.

    A flight is identified by its date, carrier, flight number, and origin, which together form
    the composite primary key. Three foreign keys connect it to the lookup tables: `carrier` to
    `airlines`, `tailnum` to `planes`, and both `origin` and `dest` to `airports`. Times are stored
    as integers in HHMM form (so 5:17 AM is `517`), and delays are in minutes, with negative values
    for early departures and arrivals. Cancelled flights have `NULL` departure and arrival times.
  columns:
  - name: year
    type: integer
    key: PK
    nullable: false
    description: Year of departure. Always 2013.
  - name: month
    type: integer
    key: PK
    nullable: false
    description: Month of departure, 1 through 12.
  - name: day
    type: integer
    key: PK
    nullable: false
    description: Day of the month of departure.
  - name: dep_time
    type: integer
    nullable: true
    description: Actual departure time, local time, in HHMM form. `NULL` for the 3,153 cancelled flights.
  - name: sched_dep_time
    type: integer
    nullable: true
    description: Scheduled departure time, local time, in HHMM form.
  - name: dep_delay
    type: integer
    nullable: true
    description: Departure delay in minutes. Negative values are early departures. `NULL` for cancelled flights.
  - name: arr_time
    type: integer
    nullable: true
    description: Actual arrival time, local time at the destination, in HHMM form.
  - name: sched_arr_time
    type: integer
    nullable: true
    description: Scheduled arrival time, local time at the destination, in HHMM form.
  - name: arr_delay
    type: integer
    nullable: true
    description: Arrival delay in minutes. Negative values are early arrivals. `NULL` for cancelled and diverted flights.
  - name: carrier
    type: varchar(2)
    key: PK, FK
    nullable: false
    references: airlines.carrier
    description: Two-character airline code, such as `UA` or `DL`. Join to `airlines` for the full name.
  - name: flight
    type: integer
    key: PK
    nullable: false
    description: Flight number. Numbers repeat across carriers, so it identifies a route only together with `carrier`.
  - name: tailnum
    type: varchar(10)
    key: FK
    nullable: true
    references: planes.tailnum
    description: Aircraft tail number. `NULL` when the source recorded a placeholder rather than a registered tail number.
  - name: origin
    type: varchar(3)
    key: PK, FK
    nullable: false
    references: airports.faa
    description: FAA code of the departure airport. Always `LGA` in this version of the data.
  - name: dest
    type: varchar(3)
    key: FK
    nullable: true
    references: airports.faa
    description: FAA code of the destination airport. 68 different destinations appear.
  - name: air_time
    type: integer
    nullable: true
    description: Minutes spent in the air. `NULL` when the flight never arrived.
  - name: distance
    type: integer
    nullable: true
    description: Distance between the two airports, in miles.
  - name: hour
    type: integer
    nullable: true
    description: Hour of the scheduled departure (`sched_dep_time` divided by 100).
  - name: minute
    type: integer
    nullable: true
    description: Minute of the scheduled departure (`sched_dep_time` modulo 100).
  - name: time_hour
    type: timestamp
    nullable: true
    description: |
      Scheduled departure date and hour as a timestamp in UTC, not New York time. Matches
      `weather.time_hour`, which makes it the column to join on for conditions at departure.
- name: airlines
  description: |
    A lookup table that turns each two-character carrier code into the airline's full name. Each
    of its 16 rows can be referenced by many flights through `flights.carrier`.
  columns:
  - name: carrier
    type: varchar(2)
    key: PK
    nullable: false
    description: Two-character airline code. Referenced by `flights.carrier`.
  - name: name
    type: varchar(100)
    nullable: true
    description: Full name of the airline, such as `American Airlines Inc.`
- name: airports
  description: |
    One row for each of 1,458 airports, identified by FAA code. It is far larger than the set
    of airports these flights use, which makes it a good table for practicing outer joins and
    anti-joins: most airports have no flights at all.

    `flights` references this table twice, once for the origin and once for the destination, and
    `weather` references it for the station that took each observation.
  columns:
  - name: faa
    type: varchar(3)
    key: PK
    nullable: false
    description: FAA airport code, such as `LGA` or `ORD`. Referenced by `flights.origin`, `flights.dest`, and `weather.origin`.
  - name: name
    type: varchar(200)
    nullable: true
    description: Airport name.
  - name: lat
    type: double precision
    nullable: true
    description: Latitude in decimal degrees.
  - name: lon
    type: double precision
    nullable: true
    description: Longitude in decimal degrees.
  - name: alt
    type: integer
    nullable: true
    description: Altitude in feet.
  - name: tz
    type: integer
    nullable: true
    description: Offset from UTC in hours during standard time, such as `-5` for New York.
  - name: dst
    type: varchar(1)
    nullable: true
    description: 'Daylight saving time rule: `A` for the standard US rule, `N` for none, `U` for unknown.'
  - name: tzone
    type: varchar(50)
    nullable: true
    description: IANA time zone name, such as `America/New_York`.
- name: planes
  description: |
    Registration details for 3,348 aircraft, identified by tail number. A plane can fly many
    flights, and a flight refers to at most one plane through the nullable `flights.tailnum`.
  columns:
  - name: tailnum
    type: varchar(10)
    key: PK
    nullable: false
    description: Aircraft tail number. Referenced by `flights.tailnum`.
  - name: year
    type: integer
    nullable: true
    description: Year the aircraft was manufactured.
  - name: type
    type: varchar(50)
    nullable: true
    description: Kind of aircraft, such as `Fixed wing multi engine` or `Rotorcraft`.
  - name: manufacturer
    type: varchar(100)
    nullable: true
    description: Aircraft manufacturer, such as `BOEING` or `EMBRAER`.
  - name: model
    type: varchar(100)
    nullable: true
    description: Manufacturer's model designation.
  - name: engines
    type: integer
    nullable: true
    description: Number of engines.
  - name: seats
    type: integer
    nullable: true
    description: Number of seats.
  - name: speed
    type: integer
    nullable: true
    description: Average cruising speed in miles per hour. Recorded for only 26 aircraft.
  - name: engine
    type: varchar(50)
    nullable: true
    description: Engine type, such as `Turbo-fan` or `Reciprocating`.
- name: weather
  description: |
    Hourly weather observations at LaGuardia for 2013, one row per hour. Its key is the station
    and the hour, `(origin, time_hour)`, rather than the separate date and hour columns: when
    daylight saving time ended on November 3, the 1:00 AM hour happened twice, and only the UTC
    timestamp tells those two observations apart.

    `weather.origin` references `airports`. There is no declared relationship to `flights`, but
    the two tables share `origin` and `time_hour`, so a join on both columns pairs each flight
    with the conditions at its scheduled departure.
  columns:
  - name: origin
    type: varchar(3)
    key: PK, FK
    nullable: false
    references: airports.faa
    description: FAA code of the weather station's airport. Always `LGA`.
  - name: year
    type: integer
    nullable: true
    description: Year of the observation, local time.
  - name: month
    type: integer
    nullable: true
    description: Month of the observation, local time.
  - name: day
    type: integer
    nullable: true
    description: Day of the month of the observation, local time.
  - name: hour
    type: integer
    nullable: true
    description: Hour of the observation, local time, 0 through 23.
  - name: temp
    type: double precision
    nullable: true
    description: Temperature in degrees Fahrenheit.
  - name: dewp
    type: double precision
    nullable: true
    description: Dew point in degrees Fahrenheit.
  - name: humid
    type: double precision
    nullable: true
    description: Relative humidity, as a percentage.
  - name: wind_dir
    type: integer
    nullable: true
    description: Wind direction in degrees.
  - name: wind_speed
    type: double precision
    nullable: true
    description: Wind speed in miles per hour.
  - name: wind_gust
    type: double precision
    nullable: true
    description: Wind gust speed in miles per hour.
  - name: precip
    type: double precision
    nullable: true
    description: Precipitation in inches.
  - name: pressure
    type: double precision
    nullable: true
    description: Sea-level pressure in millibars.
  - name: visib
    type: double precision
    nullable: true
    description: Visibility in miles.
  - name: time_hour
    type: timestamp
    key: PK
    nullable: false
    description: Date and hour of the observation as a timestamp in UTC. Matches `flights.time_hour`.
