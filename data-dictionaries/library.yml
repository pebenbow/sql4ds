# Data dictionary for the library database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: library
summary: |
  The `library` database models a small public library. Its catalog holds 500 books (editions,
  each with its own ISBN) by 746 authors from 294 publishers, tagged with 24 genres. The library
  owns 798 physical copies of those books, which its 350 patrons borrowed 2,706 times between
  August 2024 and August 2026. Ten staff members run the circulation desk, and 678 fines record
  late returns and lost items. Smaller tables cover study room reservations, the barcode scans
  behind each loan, online signup forms, and catalog searches.

  It is a teaching schema for relational design. Junction tables, a one-to-one relationship, two
  foreign keys to the same table, and `CHECK` constraints all appear in a setting that needs no
  background knowledge. A few deliberately messy tables (`legacy_checkouts`,
  `signup_submissions`, and `catalog_searches`) hold raw text for practice with cleaning dates,
  times, and strings.
source: |
  The catalog tables (`books`, `authors`, `publishers`, `genres`, and the two junction tables)
  hold actual book data fetched from the free Open Library API, so they carry the quirks of
  Open Library's records, such as a few non-English editions tagged as English. Everything
  else is fabricated by scripts. The patrons, staff, copies, checkouts, and fines are simulated
  so that no copy is ever lent to two patrons at once and every late or lost loan produces a
  fine. The supplementary tables (scans, study rooms, reservations, legacy loans, signups, and
  searches) are then generated from those core tables. All patron and staff names, emails, and
  addresses are invented.
concepts:
- concept: Many-to-many relationships through junction tables
  example: |
    `book_authors` pairs books with authors under the composite primary key
    `(book_id, author_id)`, and `book_genres` does the same for books and genres.
    `book_authors.author_order` describes the pairing itself, so it lives on the junction table.
- concept: One-to-one relationships through a unique foreign key
  example: |
    `fines.checkout_id` is both `NOT NULL` and `UNIQUE`, so each fine belongs to exactly one
    checkout and each checkout has at most one fine. `signup_submissions.patron_id` is also
    `UNIQUE` but nullable: a submission leads to at most one patron, and some lead to none.
- concept: Two foreign keys to the same table
  example: |
    `checkouts.checkout_staff_id` and `checkouts.return_staff_id` both reference `staff`, so
    showing both staff names for a loan means joining `staff` twice under different aliases.
- concept: Separating an edition from its physical copies
  example: |
    `books` has one row per edition and `copies` has one row per item on the shelf. Loans
    reference `copies.copy_id`, because a patron borrows a particular copy, not an edition.
- concept: Optional (nullable) foreign keys
  example: |
    `checkouts.return_staff_id` is `NULL` until a copy comes back, `fines.waived_by_staff_id` is
    `NULL` unless a fine was waived, and `catalog_searches.patron_id` is `NULL` for searches
    made without logging in.
- concept: CHECK constraints and defaults
  example: |
    `CHECK` constraints limit `copies.condition`, `fines.status`, and other text columns to fixed
    lists of values and keep `checkouts.due_date` from falling before `checkout_date`. Defaults
    fill in `copies.status` (`Active`) and `fines.amount_paid` (`0`) when an insert leaves them out.
- concept: A table with no keys or constraints
  example: |
    `legacy_checkouts` stores every value as text, with no primary key, foreign keys, or date
    types, and its date formats change partway through. It contrasts with the well-designed
    `checkouts` table and serves as a cleanup exercise.
extra_chapters: []
tables:
- name: publishers
  description: |
    A lookup table of the 294 publishers named in the catalog. Each publisher can be referenced
    by many books through `books.publisher_id`, and every publisher here has at least one book.
  columns:
  - name: publisher_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the publisher. Referenced by `books.publisher_id`.
  - name: name
    type: text
    key: UQ
    nullable: false
    description: Publisher name as Open Library records it, such as `Dolphin Books`. No two publishers share a name.
- name: authors
  description: |
    One row for each of 746 authors and other credited contributors. Names are stored in a single
    `full_name` column because many author names do not split cleanly into first and last parts
    (single-word pen names, multi-part surnames). The column is not unique: 28 names appear more
    than once, because different people can share a name.

    Authors connect to books only through the `book_authors` junction table. Every author here
    is credited on at least one book.
  columns:
  - name: author_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the author. Referenced by `book_authors.author_id`.
  - name: full_name
    type: text
    nullable: false
    description: The author's name as credited, such as `Stephen King` or `L. Frank Baum`.
  - name: birth_year
    type: smallint
    nullable: true
    description: Year the author was born, from 1503 to 1988. `NULL` for the 393 authors whose birth year is unknown.
- name: genres
  description: |
    A lookup table of 24 genres and subjects, such as `Mystery & Detective` and `Science
    Fiction`. Genres connect to books through the `book_genres` junction table.
  columns:
  - name: genre_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the genre. Referenced by `book_genres.genre_id`.
  - name: name
    type: text
    key: UQ
    nullable: false
    description: Genre name, such as `Fantasy` or `True Crime`. No two genres share a name.
- name: books
  description: |
    One row per edition in the catalog, identified by its ISBN-13: 500 in all. A novel released
    in both hardcover and paperback would appear as two rows. Editions are the right level for a
    circulation system because each physical copy belongs to one specific edition.

    Each book references its publisher through `publisher_id`. Its authors and genres are linked
    through the `book_authors` and `book_genres` junction tables, and its physical items are
    rows in `copies`.
  columns:
  - name: book_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the edition. Referenced by `copies`, `book_authors`, and `book_genres`.
  - name: isbn13
    type: text
    key: UQ
    nullable: false
    description: The edition's 13-digit ISBN, stored as text without hyphens, such as `9780575043329`.
  - name: title
    type: text
    nullable: false
    description: Title of the book, such as `Pride and Prejudice`.
  - name: publisher_id
    type: integer
    key: FK
    nullable: true
    references: publishers.publisher_id
    description: The edition's publisher. `NULL` for the two books with no publisher on record.
  - name: publication_year
    type: smallint
    nullable: true
    description: Year this edition was published, from 1918 to 2026.
  - name: page_count
    type: smallint
    nullable: true
    description: Number of pages. `NULL` for 24 books, and a few values are implausibly small (as low as 1) because they come straight from Open Library.
  - name: language
    type: text
    nullable: false
    description: Three-letter language code, defaulting to `eng`. All but five books are `eng`. The others are `ger`, `spa`, and `fre`.
  - name: format
    type: text
    nullable: false
    description: Physical or digital format, one of `Hardcover`, `Paperback`, `eBook`, or `Audiobook` (enforced by a `CHECK` constraint).
- name: book_authors
  description: |
    A junction table for the many-to-many relationship between books and authors. Each row pairs
    one book with one of its authors, and the composite primary key `(book_id, author_id)` keeps
    the same pair from appearing twice. It has 978 rows. Most books have a single author, but 66
    have more, and one edition of Ovid's *Metamorphoses* credits 228 contributors.

    Listing a book with its authors takes two joins: `books` to `book_authors` on `book_id`, then
    `book_authors` to `authors` on `author_id`.
  columns:
  - name: book_id
    type: integer
    key: PK, FK
    nullable: false
    references: books.book_id
    description: The book. Part of the composite primary key.
  - name: author_id
    type: integer
    key: PK, FK
    nullable: false
    references: authors.author_id
    description: The author. Part of the composite primary key.
  - name: author_order
    type: smallint
    nullable: false
    description: Position in the book's author credits, where `1` is the first-listed author. Every book has an author with order `1`, though the numbers for long credit lists can skip values.
- name: book_genres
  description: |
    A junction table for the many-to-many relationship between books and genres, with 752 rows.
    Each row tags one book with one genre, and the composite primary key `(book_id, genre_id)`
    keeps a tag from repeating. Every book has at least one genre and some have as many as seven.
  columns:
  - name: book_id
    type: integer
    key: PK, FK
    nullable: false
    references: books.book_id
    description: The book. Part of the composite primary key.
  - name: genre_id
    type: integer
    key: PK, FK
    nullable: false
    references: genres.genre_id
    description: The genre. Part of the composite primary key.
- name: copies
  description: |
    One row per physical item the library owns: 798 copies, between one and three per book.
    Patrons borrow copies, not editions, so `checkouts` references this table rather than `books`.

    The `status` column tracks the copy's own lifecycle (still in the collection, lost, or
    withdrawn). Whether a copy is currently checked out is deliberately not stored here. That
    fact can be derived from `checkouts`, where an active loan has a `NULL` `return_date`, and
    storing it twice would invite the two to disagree.
  columns:
  - name: copy_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the copy. Referenced by `checkouts.copy_id`.
  - name: book_id
    type: integer
    key: FK
    nullable: false
    references: books.book_id
    description: The edition this copy is an instance of.
  - name: barcode
    type: text
    key: UQ
    nullable: false
    description: The label scanned at the desk, `LIB` followed by seven digits, such as `LIB0000385`. Also used by `legacy_checkouts.barcode`.
  - name: acquisition_date
    type: date
    nullable: false
    description: Date the library acquired the copy, from August 2021 to July 2026.
  - name: condition
    type: text
    nullable: false
    description: Physical condition, one of `New`, `Good`, `Fair`, or `Poor` (enforced by a `CHECK` constraint).
  - name: status
    type: text
    nullable: false
    description: '`Active`, `Lost`, or `Withdrawn`, defaulting to `Active`. The 23 `Lost` and 15 `Withdrawn` copies have no loans in `checkouts`.'
- name: patrons
  description: |
    One row for each of the library's 350 cardholders. Every patron lives in North Carolina,
    and the 222 who joined in 2020 or later each have a matching online form in
    `signup_submissions`. The 128 earlier members signed up in person.

    Patrons are referenced by `checkouts`, `room_reservations`, `signup_submissions`, and
    `catalog_searches`.
  columns:
  - name: patron_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the patron.
  - name: first_name
    type: text
    nullable: false
    description: The patron's first name.
  - name: last_name
    type: text
    nullable: false
    description: The patron's last name.
  - name: email
    type: text
    key: UQ
    nullable: false
    description: Email address, always at the placeholder domain `example.com`. No two patrons share an email.
  - name: phone
    type: text
    nullable: true
    description: Phone number in `704-555-0123` form.
  - name: address
    type: text
    nullable: true
    description: Street address.
  - name: city
    type: text
    nullable: true
    description: City, such as `Gastonia` or `Huntersville`.
  - name: state
    type: text
    nullable: true
    description: Two-letter state code. Always `NC`.
  - name: zip_code
    type: text
    nullable: true
    description: Five-digit ZIP code, stored as text.
  - name: membership_type
    type: text
    nullable: false
    description: Kind of membership, one of `Adult`, `Student`, `Senior`, or `Child` (enforced by a `CHECK` constraint).
  - name: membership_start_date
    type: date
    nullable: false
    description: Date the patron joined, from August 2016 to August 2026.
- name: staff
  description: |
    The library's 10 employees. Staff appear throughout the circulation tables: `checkouts`
    references them twice (who lent the copy and who checked it back in), and `circulation_scans`
    and `fines` reference them as well.
  columns:
  - name: staff_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the staff member.
  - name: first_name
    type: text
    nullable: false
    description: The staff member's first name.
  - name: last_name
    type: text
    nullable: false
    description: The staff member's last name.
  - name: role
    type: text
    nullable: false
    description: Job title, one of `Librarian`, `Circulation Clerk`, or `Library Director` (enforced by a `CHECK` constraint).
  - name: hire_date
    type: date
    nullable: false
    description: Date the staff member was hired, from 2019 to 2024.
- name: checkouts
  description: |
    One row per loan of a physical copy: 2,706 loans with checkout dates from August 2024 to
    August 2026. Each loan references the copy, the patron, the staff member who lent it, and,
    once the copy comes back, the staff member who checked it in. Loans before August 2024 come
    from the previous system and live in `legacy_checkouts`.

    A loan with a `NULL` `return_date` is still out, and 301 loans are in that state. Late and
    lost loans have a matching row in `fines`, and each loan's checkout and return scans are in
    `circulation_scans`.
  columns:
  - name: checkout_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the loan. Referenced by `fines.checkout_id` and `circulation_scans.checkout_id`.
  - name: copy_id
    type: integer
    key: FK
    nullable: false
    references: copies.copy_id
    description: The physical copy that was lent.
  - name: patron_id
    type: integer
    key: FK
    nullable: false
    references: patrons.patron_id
    description: The patron who borrowed the copy.
  - name: checkout_staff_id
    type: integer
    key: FK
    nullable: false
    references: staff.staff_id
    description: The staff member who checked the copy out.
  - name: checkout_date
    type: date
    nullable: false
    description: Date the copy was checked out.
  - name: due_date
    type: date
    nullable: false
    description: Date the copy is due back, always 21 days after `checkout_date`. A `CHECK` constraint keeps it from falling before the checkout date.
  - name: return_date
    type: date
    nullable: true
    description: Date the copy came back. `NULL` while the copy is still out, including the 86 loans whose copies were never returned and drew a lost-item fine.
  - name: return_staff_id
    type: integer
    key: FK
    nullable: true
    references: staff.staff_id
    description: The staff member who checked the copy back in. `NULL` exactly when `return_date` is `NULL`.
- name: circulation_scans
  description: |
    The circulation desk's barcode-scan log, with one row for each checkout scan and one for each
    return scan: 5,111 rows. `checkouts` stores the dates of each loan, and this table stores the
    exact moments behind them, to the second. A `UNIQUE` constraint on `(checkout_id, scan_type)`
    allows at most one scan of each type per loan.

    Every loan has a checkout scan, but loans still out have no return scan, so there are 2,706
    checkout scans and only 2,405 return scans. The `staff_id` on each scan matches the
    corresponding staff column in `checkouts`.
  columns:
  - name: scan_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the scan.
  - name: checkout_id
    type: integer
    key: FK
    nullable: false
    references: checkouts.checkout_id
    description: The loan this scan belongs to.
  - name: scan_type
    type: text
    nullable: false
    description: '`checkout` or `return` (enforced by a `CHECK` constraint).'
  - name: scanned_at
    type: timestamptz
    nullable: false
    description: The instant of the scan, stored in UTC. Converted to `America/New_York` time, its date matches the loan's `checkout_date` or `return_date`.
  - name: staff_id
    type: integer
    key: FK
    nullable: false
    references: staff.staff_id
    description: The staff member who scanned the item.
- name: fines
  description: |
    One row per fine: 678 in all. A fine is assessed when a copy comes back late, when it is
    still out past its due date, or when it is never returned. Late fees run $0.25 per day up
    to $10.00, and a lost item costs a flat $25.00.

    `fines.checkout_id` is `NOT NULL` and `UNIQUE`, which makes this a one-to-one relationship
    with `checkouts`: each fine belongs to one loan, and a loan has at most one fine. Loans
    returned on time simply have no row here. The table tracks the whole lifecycle of a fine
    (assessed, then paid or waived) rather than just an amount.
  columns:
  - name: fine_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the fine.
  - name: checkout_id
    type: integer
    key: FK, UQ
    nullable: false
    references: checkouts.checkout_id
    description: The loan that drew the fine. Unique, so no loan has two fines.
  - name: amount_assessed
    type: numeric(6,2)
    nullable: false
    description: Amount charged, in dollars. A `CHECK` constraint requires it to be greater than zero.
  - name: amount_paid
    type: numeric(6,2)
    nullable: false
    description: Amount paid so far, in dollars, defaulting to `0`. A `CHECK` constraint keeps it between zero and `amount_assessed`.
  - name: status
    type: text
    nullable: false
    description: '`Outstanding`, `Paid`, or `Waived`, defaulting to `Outstanding` (enforced by a `CHECK` constraint).'
  - name: assessed_date
    type: date
    nullable: false
    description: Date the fine was assessed.
  - name: paid_date
    type: date
    nullable: true
    description: Date the fine was paid. `NULL` unless `status` is `Paid`.
  - name: waived_by_staff_id
    type: integer
    key: FK
    nullable: true
    references: staff.staff_id
    description: The staff member who waived the fine. `NULL` unless `status` is `Waived`.
  - name: waived_date
    type: date
    nullable: true
    description: Date the fine was waived. `NULL` unless `status` is `Waived`.
- name: study_rooms
  description: |
    The five study rooms patrons can reserve, from two-person quiet rooms to a 20-person
    community room. Reservations are in `room_reservations`.
  columns:
  - name: room_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the room. Referenced by `room_reservations.room_id`.
  - name: room_name
    type: text
    key: UQ
    nullable: false
    description: Name of the room, such as `Quiet Room A` or `Community Room`.
  - name: capacity
    type: integer
    nullable: false
    description: Maximum number of people. A `CHECK` constraint requires it to be greater than zero.
  - name: has_display
    type: boolean
    nullable: false
    description: Whether the room has a display screen, defaulting to `FALSE`.
- name: room_reservations
  description: |
    One row per study room booking: 1,732 reservations that start between August 2025 and
    August 2026, each between 30 minutes and three hours long. Each references the room and the patron
    who booked it.

    The table mixes two kinds of time on purpose. `start_time` and `end_time` are local clock
    times with no time zone, while `booked_at` is an absolute instant. There is also no constraint
    against overlapping bookings: a booking-system bug in February 2026 accepted nine double
    bookings, and they remain in the data.
  columns:
  - name: reservation_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the reservation.
  - name: room_id
    type: integer
    key: FK
    nullable: false
    references: study_rooms.room_id
    description: The room that was booked.
  - name: patron_id
    type: integer
    key: FK
    nullable: false
    references: patrons.patron_id
    description: The patron who made the booking.
  - name: booked_at
    type: timestamptz
    nullable: false
    description: The instant the patron made the reservation online, stored in UTC.
  - name: start_time
    type: timestamp
    nullable: false
    description: When the booking begins, in local wall-clock time at the library with no time zone.
  - name: end_time
    type: timestamp
    nullable: false
    description: When the booking ends, in local wall-clock time. A `CHECK` constraint requires it to be later than `start_time`.
  - name: status
    type: text
    nullable: false
    description: '`Completed`, `Cancelled`, or `No-show` (enforced by a `CHECK` constraint).'
- name: signup_submissions
  description: |
    Raw entries from the online membership form, which launched in January 2020, exactly as
    applicants typed them: inconsistent capitalization, stray spaces, assorted phone and address
    formats, and some names entered as `Last, First`. It has 250 rows and serves as material for
    string-cleaning exercises.

    Staff turned each approved submission into a clean `patrons` row, and `patron_id` links the
    two. Because that column is `UNIQUE`, each patron has at most one submission. The 28
    submissions with a `NULL` `patron_id` were never approved: repeat submissions from existing
    applicants, along with junk and test entries.
  columns:
  - name: submission_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the submission.
  - name: submitted_at
    type: timestamptz
    nullable: false
    description: The instant the form was submitted, stored in UTC.
  - name: full_name
    type: text
    nullable: false
    description: Name as typed, such as `matthew ROBINSON` or `LEWIS, JOSEPH`.
  - name: email
    type: text
    nullable: false
    description: Email as typed, sometimes with stray spaces or unusual capitalization. Not unique.
  - name: phone
    type: text
    nullable: true
    description: Phone number as typed, in formats such as `(704) 427-6103`, `7042519909`, or `+1 704-913-2221`.
  - name: street_address
    type: text
    nullable: true
    description: Street address as typed, such as `956  Oak Street` or `267 DEPOT ST.`
  - name: city_state_zip
    type: text
    nullable: true
    description: City, state, and ZIP code typed into one field, such as `Gastonia,nc 28052`.
  - name: patron_id
    type: integer
    key: FK, UQ
    nullable: true
    references: patrons.patron_id
    description: The patron created from this submission. `NULL` for submissions that were never approved.
- name: catalog_searches
  description: |
    The 4,000 queries typed into the online catalog's search box between August 2024 and August
    2026, recorded verbatim. They include titles, partial titles, typos, author names, ISBNs with
    or without hyphens, subjects, and requests the catalog cannot answer, which makes the table
    useful for practicing string matching against `books` and `authors`.
  columns:
  - name: search_id
    type: integer
    key: PK
    nullable: false
    description: Unique identifier for the search.
  - name: searched_at
    type: timestamptz
    nullable: false
    description: The instant of the search, stored in UTC.
  - name: patron_id
    type: integer
    key: FK
    nullable: true
    references: patrons.patron_id
    description: The logged-in patron who searched. `NULL` for the 1,621 searches made without logging in.
  - name: query_text
    type: text
    nullable: false
    description: The search text exactly as typed, such as `frankenstein` or `bag bones`. Some queries have leading or trailing spaces.
- name: legacy_checkouts
  description: |
    A raw export of the 2,094 loans recorded by the library's previous circulation system,
    covering October 2021 to August 2024. The current `checkouts` table picks up where it leaves
    off. The export was imported as is: every column is `TEXT`, and the table has no primary key,
    foreign keys, or other constraints.

    The old system's quirks survive in the data. Checkout and return times were written as
    `MM/DD/YYYY H:MI AM` until a software upgrade on June 12, 2023, and as `DD-MON-YY HH.MI.SS AM`
    afterward. The format follows the date of each event, so a loan that spans the upgrade mixes
    both formats in one row. The old loan period was 14 days, compared with 21 in the current
    system.
  columns:
  - name: legacy_id
    type: text
    nullable: true
    description: The old system's loan number, a six-digit string with leading zeros, such as `000001`.
  - name: barcode
    type: text
    nullable: true
    description: Barcode of the copy that was lent. Matches `copies.barcode`, though no foreign key enforces it.
  - name: patron_id
    type: text
    nullable: true
    description: The borrowing patron's ID stored as text. Matches `patrons.patron_id` once converted to an integer.
  - name: checked_out
    type: text
    nullable: true
    description: Checkout date and time as text, in `10/07/2021 5:53 PM` form before the June 2023 upgrade and `12-JUN-23 12.32.22 PM` form after it.
  - name: due_back
    type: text
    nullable: true
    description: Due date as text in `YYYYMMDD` form, such as `20211021`.
  - name: returned
    type: text
    nullable: true
    description: Return date and time as text, in the same two formats as `checked_out`. The literal string `LOST` marks the nine copies that never came back, which are marked `Lost` in `copies`.
