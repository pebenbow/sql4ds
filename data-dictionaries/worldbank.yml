# Data dictionary for the worldbank database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: worldbank
summary: |
  The `worldbank` database holds yearly development indicators for the world's countries from
  1960 through 2023. The `countries` table lists 299 entries: 218 individual countries and
  territories plus 81 aggregates such as "World", "Euro area", and "High income". The
  `indicators` table holds 16,704 country-year rows of measurements such as population, GDP, and
  forest area. Three small lookup tables name the region, income group, and lending type each
  country belongs to, and the `series` table describes the nine measurements.

  It is the book's main dataset for joins and set operations. The gap between `countries` and
  `indicators` (38 entries have no measurements at all) gives outer joins and anti-joins
  something to find, and the aggregate rows mixed in with the countries are a constant reminder
  to filter with `is_aggregate`.
source: |
  The data comes from the World Bank. Every measurement in `series` is listed as coming from
  the World Development Indicators, and the `source_org` column credits the original providers,
  such as the Food and Agriculture Organization for land use and the United Nations Population
  Division for population. The region, income group, and lending type classifications are the
  World Bank's own.
concepts:
- concept: Lookup tables
  example: |
    `regions`, `income_groups`, and `lending_types` each map a small integer ID to a name.
    `countries` stores only the IDs, so reading a country's region means an `INNER JOIN` to
    `regions` on `region_id`.
- concept: Surrogate keys alongside natural keys
  example: |
    `countries` is keyed by the integer `id`, but the three-letter `country_code` is also unique
    and could serve as a key. `series` has the same pattern: an integer `id` and a unique
    `indicator_code`.
- concept: A composite primary key that includes a foreign key
  example: |
    `indicators` is keyed by `(country_id, year)`. Neither column is unique on its own, and
    `country_id` is also the foreign key to `countries.id`.
- concept: Aggregate rows mixed with countries
  example: |
    `countries` includes 81 aggregates, such as "World" and "Sub-Saharan Africa", flagged by
    `is_aggregate`. Their `region_id`, `income_group_id`, and `lending_type_id` are all `NULL`,
    and queries that count or rank countries add `WHERE NOT is_aggregate` to leave them out.
- concept: NULL as missing data
  example: |
    Every country in `indicators` has a row for each of the 64 years, so a missing measurement
    shows up as a `NULL` rather than a missing row. `pct_forest_area` is recorded only from 1990
    through 2022, and the rural and urban land areas only for 1990, 2000, and 2015.
- concept: Metadata without a foreign key
  example: |
    Each row of `series` describes one measurement column of `indicators`, such as
    `NY.GDP.PCAP.CD` for `gdp_per_capita_usd`. No foreign key connects the two tables, because
    the link is between a row in one table and a column name in the other.
extra_chapters: []
tables:
- name: countries
  description: |
    One row per country, territory, or aggregate group tracked by the World Bank: 299 rows, of
    which 218 are individual countries and territories and 81 are aggregates. This is the central
    table of the database. Three foreign keys point from it to the lookup tables `regions`,
    `income_groups`, and `lending_types`, and `indicators` refers to it through
    `indicators.country_id`.

    The aggregates are flagged by `is_aggregate` and have `NULL` in all three foreign key
    columns. 38 entries have no rows in `indicators`: 37 aggregates and Taiwan, China. The other
    44 aggregates do have measurements, so a total over all of `indicators` counts the same
    people or dollars more than once unless the aggregates are filtered out.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Surrogate key, an integer from 1 to 299. Referenced by `indicators.country_id`.
  - name: country_code
    type: varchar(3)
    key: UQ
    nullable: false
    description: Three-letter World Bank code, such as `USA` or `KEN`. Aggregates have codes too, such as `WLD` for the world.
  - name: iso2_code
    type: varchar(2)
    nullable: true
    description: Two-character code, such as `US`. For aggregates it is a World Bank code that may contain digits, such as `1A` for the Arab World.
  - name: short_name
    type: varchar(100)
    nullable: true
    description: Common name of the country or aggregate, such as `Afghanistan` or `Euro area`.
  - name: region_id
    type: smallint
    key: FK
    nullable: true
    references: regions.region_id
    description: Geographic region of the country. `NULL` for aggregates. Join to `regions` for the name.
  - name: capital
    type: varchar(100)
    nullable: true
    description: |
      Name of the capital city. Missing capitals are stored as an empty string (`''`), not
      `NULL`: all aggregates and seven countries, including Israel and Hong Kong SAR, China.
  - name: longitude
    type: double precision
    nullable: true
    description: Longitude of the capital in decimal degrees. `NULL` for aggregates and a few countries.
  - name: latitude
    type: double precision
    nullable: true
    description: Latitude of the capital in decimal degrees. `NULL` for aggregates and a few countries.
  - name: income_group_id
    type: smallint
    key: FK
    nullable: true
    references: income_groups.income_group_id
    description: World Bank income classification of the country. `NULL` for aggregates. Join to `income_groups` for the name.
  - name: lending_type_id
    type: smallint
    key: FK
    nullable: true
    references: lending_types.lending_type_id
    description: World Bank lending category of the country. `NULL` for aggregates. Join to `lending_types` for the name.
  - name: is_aggregate
    type: boolean
    nullable: false
    description: '`true` for groups of countries such as regions and income groups, `false` for individual countries and territories.'
- name: indicators
  description: |
    One row per country per year, holding the measurements for that combination: 16,704 rows
    covering 261 entries in `countries` for every year from 1960 through 2023. The composite
    primary key is `(country_id, year)`, and `country_id` is a foreign key to `countries.id`.

    The table is wide: each measurement has its own column rather than its own row. Rows exist
    for every year even when nothing was measured, so gaps in the data appear as `NULL`s. Each
    measurement column corresponds to one row of `series`, which explains what it means and where
    it comes from, but no foreign key connects the two tables.
  columns:
  - name: id
    type: integer
    nullable: true
    description: Row number carried over from the source data, unique in practice but not a declared key. The primary key is `(country_id, year)`.
  - name: country_id
    type: integer
    key: PK, FK
    nullable: false
    references: countries.id
    description: The country or aggregate this row describes. Join to `countries` on `id` for its name and classifications.
  - name: year
    type: integer
    key: PK
    nullable: false
    description: Year of the measurements, 1960 through 2023.
  - name: pct_agricultural_land
    type: double precision
    nullable: true
    description: Agricultural land as a percentage of land area (series `AG.LND.AGRI.ZS`). Recorded from 1961 through 2022.
  - name: pct_arable_land
    type: double precision
    nullable: true
    description: Arable land as a percentage of land area (series `AG.LND.ARBL.ZS`).
  - name: pct_forest_area
    type: double precision
    nullable: true
    description: Forest area as a percentage of land area (series `AG.LND.FRST.ZS`). Recorded only from 1990 through 2022.
  - name: rural_land_area_km2
    type: double precision
    nullable: true
    description: Rural land area in square kilometers (series `AG.LND.TOTL.RU.K2`). Recorded only for 1990, 2000, and 2015.
  - name: urban_land_area_km2
    type: double precision
    nullable: true
    description: Urban land area in square kilometers (series `AG.LND.TOTL.UR.K2`). Recorded only for 1990, 2000, and 2015.
  - name: land_area_km2
    type: double precision
    nullable: true
    description: Total land area in square kilometers, excluding inland water (series `AG.LND.TOTL.K2`).
  - name: population
    type: bigint
    nullable: true
    description: Total population, counting all residents regardless of legal status or citizenship (series `SP.POP.TOTL`). The most complete column, `NULL` in only 30 rows.
  - name: gdp_usd
    type: double precision
    nullable: true
    description: Gross domestic product in current US dollars, not adjusted for inflation (series `NY.GDP.MKTP.CD`).
  - name: gdp_per_capita_usd
    type: double precision
    nullable: true
    description: GDP divided by midyear population, in current US dollars (series `NY.GDP.PCAP.CD`).
- name: series
  description: |
    Metadata for the nine measurements stored in `indicators`, one row per measurement. Each row
    gives the World Bank's indicator code and name, a definition, and the organizations that
    supply the data.

    There is no foreign key between `series` and `indicators`. A row here describes a column
    there: `Forest area (% of land area)` describes `indicators.pct_forest_area`, for example. The
    match has to be made by reading the names, not by a join.
  columns:
  - name: id
    type: integer
    key: PK
    nullable: false
    description: Surrogate key, 1 through 9.
  - name: indicator_code
    type: varchar(20)
    key: UQ
    nullable: false
    description: World Bank indicator code, such as `SP.POP.TOTL` for total population or `NY.GDP.PCAP.CD` for GDP per capita.
  - name: indicator_name
    type: varchar(200)
    nullable: true
    description: Human-readable name of the measurement, including its units, such as `GDP (current US$)`.
  - name: description
    type: text
    nullable: true
    description: Full definition of the measurement, one or more sentences long.
  - name: source
    type: varchar(100)
    nullable: true
    description: World Bank database the measurement is drawn from. `World Development Indicators` in every row.
  - name: source_org
    type: text
    nullable: true
    description: Organizations that originally collected the data, such as the Food and Agriculture Organization.
- name: regions
  description: |
    A lookup table naming the seven geographic regions the World Bank sorts countries into, such
    as `South Asia` and `Sub-Saharan Africa`. Each region can be referenced by many countries
    through `countries.region_id`. Aggregates belong to no region.
  columns:
  - name: region_id
    type: smallint
    key: PK
    nullable: false
    description: Region identifier, 1 through 7. Referenced by `countries.region_id`.
  - name: name
    type: varchar(100)
    key: UQ
    nullable: false
    description: Region name, such as `Europe & Central Asia` or `Latin America & Caribbean`.
- name: income_groups
  description: |
    A lookup table naming the five World Bank income classifications. Each can be referenced by
    many countries through `countries.income_group_id`. Venezuela is the only country in the
    `Not classified` group.
  columns:
  - name: income_group_id
    type: smallint
    key: PK
    nullable: false
    description: Income group identifier, 1 through 5. Referenced by `countries.income_group_id`.
  - name: name
    type: varchar(50)
    key: UQ
    nullable: false
    description: '`High income`, `Upper middle income`, `Lower middle income`, `Low income`, or `Not classified`.'
- name: lending_types
  description: |
    A lookup table naming the four World Bank lending categories. Each can be referenced by many
    countries through `countries.lending_type_id`. `IBRD` and `IDA` are the World Bank's two main
    lending arms, `Blend` countries can borrow from both, and `Not classified` covers 74
    countries, 70 of them high income.
  columns:
  - name: lending_type_id
    type: smallint
    key: PK
    nullable: false
    description: Lending type identifier, 1 through 4. Referenced by `countries.lending_type_id`.
  - name: name
    type: varchar(50)
    key: UQ
    nullable: false
    description: '`IBRD`, `IDA`, `Blend`, or `Not classified`.'
