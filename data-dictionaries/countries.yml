# Data dictionary for the countries database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: countries
summary: |
  The `countries` database holds a single table of 215 countries and territories, one row each,
  with their ISO codes, World Bank region, capital city and its coordinates, and their population
  and land area in 2022.

  The table is a flat file loaded as-is: it has no primary key, no constraints, and every column
  accepts `NULL`. That makes it a compact example of raw extracted data, the kind of table the
  book's ETL chapters start from before they clean the data and load it into a designed schema.
  No chapter of the book connects to this database directly.
source: |
  The data comes from the World Bank. Country names, ISO codes, regions, capitals, and
  coordinates follow the World Bank's country metadata, and `population` and `area` match the
  2022 values of its World Development Indicators "Population, total" and "Land area (sq. km)".
concepts:
- concept: A table with no primary key
  example: |
    No column or set of columns is declared as a key, so nothing stops the table from holding two
    identical rows or a row with no `iso3c`. Each country happens to appear once, and `iso3c` is
    unique in practice, but the database does not guarantee it.
- concept: A flat file loaded as-is
  example: |
    With no keys or constraints to violate, every row loads without error, whatever it contains.
    The checks that a designed schema would enforce, such as unique codes and required names, are
    left to whoever cleans the data.
- concept: NULL as missing data
  example: |
    Seven territories have no `area`, six have no `capital`, and six have no `longitude` or
    `latitude`. The gaps do not line up: Hong Kong has coordinates but no capital, and Curacao has a
    capital but no coordinates.
- concept: Choosing numeric types
  example: |
    `population` is a `bigint` whole number, `area` is an exact `numeric` that keeps values such as
    `2.084` for Monaco, and `longitude` and `latitude` are approximate floating-point `real` values.
- concept: Grouping and aggregating categories
  example: |
    `region` has seven values, from `Europe & Central Asia` with 57 countries to `North America`
    with 3, which makes it a natural column for counting countries or summing population by
    region.
extra_chapters: []
tables:
- name: countries
  description: |
    One row per country or territory, 215 in all, as of 2022. Every row has the same `yr` and the
    same `lastupdated` date, so the table is a single snapshot rather than a time series. The rows
    include territories such as Gibraltar and Puerto Rico alongside sovereign states, but no
    aggregate rows for regions or the world. Two economies that the World Bank does report, the
    Czech Republic and Vietnam, are missing.

    The table has no primary key and no constraints, and every column is nullable. The ISO codes
    `iso2c` and `iso3c` are the most reliable identifiers, since they are unique and always
    present, while `country` uses the World Bank's naming style, such as `Korea, Rep.` or
    `Egypt, Arab Rep.`
  columns:
  - name: country
    type: varchar(200)
    nullable: true
    description: Country or territory name in the World Bank's style, which puts qualifiers after a comma, as in `Bahamas, The` or `Venezuela, RB`.
  - name: iso2c
    type: varchar(2)
    nullable: true
    description: Two-letter ISO country code, such as `AF` for Afghanistan.
  - name: iso3c
    type: varchar(3)
    nullable: true
    description: Three-letter ISO country code, such as `AFG` for Afghanistan. Unique for each row, though no constraint enforces it.
  - name: yr
    type: integer
    nullable: true
    description: Year the `population` and `area` figures describe. Always `2022`.
  - name: population
    type: bigint
    nullable: true
    description: Total population in 2022, from 9,992 (Tuvalu) to about 1.43 billion (India).
  - name: area
    type: numeric
    nullable: true
    description: Land area in square kilometers, from about 2 (Monaco) to about 16.4 million (Russia). `NULL` for seven territories, including Hong Kong, Israel, and Kosovo.
  - name: lastupdated
    type: date
    nullable: true
    description: Date the World Bank last updated the figures. Always `2024-12-16`.
  - name: region
    type: varchar(200)
    nullable: true
    description: World Bank geographic region, one of seven values such as `Sub-Saharan Africa` or `Latin America & Caribbean`.
  - name: capital
    type: varchar(200)
    nullable: true
    description: Name of the capital city. `NULL` for six territories, including the Channel Islands and Hong Kong.
  - name: longitude
    type: real
    nullable: true
    description: Longitude of the capital city in decimal degrees, negative west of Greenwich. `NULL` for six territories.
  - name: latitude
    type: real
    nullable: true
    description: Latitude of the capital city in decimal degrees, negative south of the equator. `NULL` for six territories.
