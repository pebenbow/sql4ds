# Data dictionary for the actors database (open-sql-docker).
# Generated by scripts/build_data_dictionaries.py: tables, columns, type, key, nullable,
# and references come from the schema; re-run the script after a schema change.
# Hand-written: summary, source, concepts, extra_chapters, and every description.
# extra_chapters lists .qmd files to back-link beyond those that connect to this
# database (which are found automatically).
database: actors
summary: |
  The `actors` database holds a single table of 200 film actors, from Edward G. Robinson (born
  1893) to Timothée Chalamet (born 2000). Each row records an actor's names, sex, birth and
  death dates, country of birth, height, Oscar record, primary genre, best-known film, and
  career box office total.

  It is the book's first dataset. With only one table there are no joins to think about, so the
  early chapters use it to introduce `SELECT`, filtering with `WHERE`, sorting, data types, and
  grouping with `GROUP BY`. Its columns mix text, fixed-length codes, whole numbers, exact
  decimals, dates, and booleans, and several of them contain `NULL`s with a clear meaning.
source: |
  The table was compiled by hand for this book and its companion Docker image. The actors are
  real people, but the figures were entered by hand rather than drawn from an authoritative
  source, so treat values such as heights, nomination counts, and box office totals as
  approximate teaching data rather than reference data.
concepts:
- concept: A surrogate key
  example: |
    `actor_id` is a plain integer from 1 to 200 that identifies each row. It carries no meaning of
    its own, which is the point: names can repeat or change, but the ID never does.
- concept: Choosing a data type for each value
  example: |
    `sex` is `char(1)`, the names are `varchar`, `height_cm` and the Oscar counts are `smallint`,
    `total_box_office_usd` is an exact `numeric(12,0)`, the two dates are `date`, and
    `has_honorary_oscar` is a `boolean`.
- concept: NOT NULL, defaults, and CHECK constraints
  example: |
    `sex` must be `'M'` or `'F'`, and a constraint requires `oscar_wins` to be no larger than
    `oscar_nominations`. Both Oscar counts default to `0` and `has_honorary_oscar` defaults to
    `false`, so a new row can leave them out.
- concept: NULL as missing data
  example: |
    `death_date` is `NULL` for the 118 living actors, and `birth_name` is `NULL` for the 130 who
    have no separate birth name on record. `COUNT(death_date)` therefore counts only deceased
    actors.
- concept: Grouping and aggregating categories
  example: |
    `primary_genre` has eight values and `birth_country` has 19, which makes them natural
    `GROUP BY` columns for counting actors or summing Oscar wins per category.
extra_chapters: []
tables:
- name: actors
  description: |
    One row per actor, 200 in all, identified by the surrogate key `actor_id`. There are 101 men
    and 99 women, and 82 of the actors have died.

    Most columns are required. The constraints keep the data consistent: `sex` accepts only `M`
    or `F`, and `oscar_wins` can never exceed `oscar_nominations`. Drama is by far the most common
    `primary_genre`, with 135 actors, and half of the actors were born in the USA.
  columns:
  - name: actor_id
    type: integer
    key: PK
    nullable: false
    description: Surrogate key that identifies the actor, numbered 1 through 200.
  - name: first_name
    type: varchar(50)
    nullable: false
    description: First name the actor is known by professionally, such as `Meryl`.
  - name: last_name
    type: varchar(50)
    nullable: false
    description: Last name the actor is known by professionally, such as `Streep`.
  - name: birth_name
    type: varchar(100)
    nullable: true
    description: Full legal name at birth, such as `Julia Elizabeth Wells` for Julie Andrews. `NULL` for the 130 actors with no separate birth name on record.
  - name: sex
    type: char(1)
    nullable: false
    description: One-character code, `M` or `F`, enforced by a `CHECK` constraint.
  - name: birth_date
    type: date
    nullable: false
    description: Date of birth, from 1893 through 2000.
  - name: death_date
    type: date
    nullable: true
    description: Date of death. `NULL` for actors who are still living.
  - name: birth_country
    type: varchar(50)
    nullable: false
    description: Country of birth as a short name, such as `USA`, `UK`, or `France`. 19 different countries appear.
  - name: height_cm
    type: smallint
    nullable: true
    description: Height in centimeters, from 152 to 196. Recorded for every actor even though the column allows `NULL`.
  - name: oscar_nominations
    type: smallint
    nullable: false
    description: Number of Academy Award nominations, from 0 to 21. Defaults to `0`.
  - name: oscar_wins
    type: smallint
    nullable: false
    description: Number of Academy Awards won, from 0 to 4, not counting honorary awards. Defaults to `0` and can never exceed `oscar_nominations`.
  - name: primary_genre
    type: varchar(20)
    nullable: false
    description: 'The genre the actor is best known for, one of eight values: `Drama`, `Action`, `Comedy`, `Musical`, `Thriller`, `Romance`, `Horror`, or `Sci-Fi`.'
  - name: has_honorary_oscar
    type: boolean
    nullable: false
    description: Whether the actor has received an honorary Academy Award, which is separate from `oscar_wins`. `true` for 17 actors and defaults to `false`.
  - name: notable_role
    type: text
    nullable: true
    description: Title of the film the actor is best known for, such as `Forrest Gump`. Despite the name, it holds a film title rather than a character.
  - name: total_box_office_usd
    type: numeric(12,0)
    nullable: true
    description: Approximate combined box office of the actor's films, in whole US dollars, from 72 million to 9.2 billion.
